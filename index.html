<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IBNM Música">
<title>Ministério de Música IBNM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --verde-escuro:#0b3d2e; --verde:#145c43; --verde-med:#1f7a5a; --verde-claro:#2fa377;
  --dourado:#f1c40f; --dourado-esc:#c9a200; --branco:#ffffff; --cinza:#eef4f1;
  --txt:#0b241b; --sombra:0 8px 28px rgba(0,0,0,.18); --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;color:var(--txt);background:var(--cinza);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit}
a{color:var(--verde-med)}
.hidden{display:none !important}

/* Marca d'agua de notas musicais */
.watermark{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.08}
.watermark span{position:absolute;color:#fff;user-select:none}
.scr-login .watermark span{color:#fff}

/* ===== TELAS DE AUTENTICACAO ===== */
.scr-auth{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:linear-gradient(160deg,var(--verde-escuro),var(--verde) 60%,var(--verde-med));color:#fff;overflow-y:auto;padding:28px 20px 40px}
.logo-wrap{text-align:center;margin:18px 0 10px}
.logo-emblema{width:132px;height:132px;margin:0 auto;position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.auth-card{width:100%;max-width:420px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(6px);border-radius:var(--radius);padding:22px;margin-top:6px;box-shadow:var(--sombra)}
.auth-card h2{font-size:20px;margin-bottom:4px;text-align:center}
.auth-card .sub{font-size:13px;opacity:.85;text-align:center;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;margin-bottom:6px;font-weight:600;opacity:.95}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.95);color:var(--txt);font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:var(--dourado);box-shadow:0 0 0 3px rgba(241,196,15,.25)}
.field .olho-senha{position:absolute;right:6px;bottom:7px;background:none;border:0;padding:6px;font-size:17px;line-height:1;color:inherit;opacity:.75;cursor:pointer}
.field .olho-senha:hover,.field .olho-senha:focus{opacity:1}
/* ---------- Conectividade (Painel do ADM) ---------- */
.conect-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #eef1ef}
.conect-row:last-child{border-bottom:0}
.conect-row .cd{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:#c9ced6}
.conect-row.ok .cd{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.conect-row.atencao .cd{background:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.18)}
.conect-row.erro .cd{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.conect-row b{font-size:14px;color:var(--verde-escuro)}
.conect-row .st{font-size:12px;font-weight:800;margin-left:6px}
.conect-row.ok .st{color:#16a34a}
.conect-row.atencao .st{color:#ea580c}
.conect-row.erro .st{color:#dc2626}
.conect-row .det{font-size:12.5px;color:#556;margin-top:2px}
.conect-sol{font-size:12.5px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 8px;margin-top:6px;color:#9a3412}
.conect-sol.erro{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.conect-sol b{font-size:12px}
.conect-sol ul{margin:4px 0 0;padding-left:18px}
.conect-sol li{margin:2px 0}
.field .hint{font-size:11.5px;opacity:.8;margin-top:4px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.check-inline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;opacity:.95;margin-top:8px}
.check-inline input{width:18px;height:18px;flex:none}
.btn{display:block;width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:700;transition:.15s}
.btn-primary{background:var(--dourado);color:#3a2f00}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-google{background:#fff;color:#444;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.btn-google svg{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;opacity:.7;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.3)}
.auth-switch{text-align:center;font-size:13.5px;margin-top:16px}
.auth-switch a{color:var(--dourado);font-weight:700;text-decoration:none;cursor:pointer}
.pwd-rules{font-size:11.5px;margin-top:6px;line-height:1.6}
.pwd-rules li{list-style:none;opacity:.6}
.pwd-rules li.ok{opacity:1;color:#9fe8c4}
.pwd-rules li.ok::before{content:'\2713 '}
.pwd-rules li::before{content:'\25cb '}
.err-msg{background:rgba(231,76,60,.9);color:#fff;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.ok-msg{background:rgba(46,204,113,.9);color:#063;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.ver-foot{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;z-index:60;color:rgba(255,255,255,.6);pointer-events:none}
.app-shell .ver-foot{color:rgba(11,61,46,.45)}

/* ===== APP SHELL ===== */
.app-shell{position:relative;min-height:100%;z-index:5;background:var(--cinza)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:linear-gradient(120deg,var(--verde-escuro),var(--verde-med));color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.hamb{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.hamb span{display:block;width:20px;height:2.5px;background:#fff;position:relative}
.hamb span::before,.hamb span::after{content:'';position:absolute;left:0;width:20px;height:2.5px;background:#fff}
.hamb span::before{top:-6px}.hamb span::after{top:6px}
.topbar .ttl{font-size:16px;font-weight:800;letter-spacing:.3px;flex:1;line-height:1.1}
.topbar .ttl small{display:block;font-size:10px;font-weight:600;opacity:.8;letter-spacing:1px}
.topbar .ico-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none;position:relative;color:#fff;font-size:19px}
.badge{position:absolute;top:-2px;right:-2px;background:var(--dourado);color:#3a2f00;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar-mini{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--dourado);background:#fff;flex:none}

/* ===== MENU LATERAL (abre da esquerda, submenus abrem para a direita) ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:48;opacity:0;visibility:hidden;transition:.25s}
.overlay.show{opacity:1;visibility:visible}
.sidemenu{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:84vw;background:linear-gradient(180deg,var(--verde-escuro),var(--verde));color:#fff;
  z-index:49;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:6px 0 24px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow-y:auto}
.sidemenu.show{transform:translateX(0)}
.sm-head{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.sm-head .logo-emblema{width:76px;height:76px;margin-bottom:8px}
.sm-head .nm{font-weight:800;font-size:15px}
.sm-head .rl{font-size:11.5px;opacity:.8;margin-top:2px}
.sm-nav{padding:10px 0;flex:1}
.sm-item{display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:14.5px;font-weight:600;color:#fff;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.sm-item .ic{font-size:18px;width:24px;text-align:center}
.sm-item .ar{margin-left:auto;transition:.2s}
.sm-item.open .ar{transform:rotate(90deg)}
.sm-item:active,.sm-item.active{background:rgba(255,255,255,.1);border-left-color:var(--dourado)}
.sm-sub{max-height:0;overflow:hidden;transition:max-height .3s ease;background:rgba(0,0,0,.18)}
.sm-sub.open{max-height:400px}
.sm-sub button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 20px 11px 54px;font-size:13.5px;color:rgba(255,255,255,.9);background:none}
.sm-sub button:active{background:rgba(255,255,255,.08)}
.sm-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.6}

/* ===== CONTEUDO / PAGINAS ===== */
.content{padding:16px 14px 70px;max-width:720px;margin:0 auto;position:relative;z-index:5}
.page{animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-ttl{font-size:19px;font-weight:800;color:var(--verde-escuro);margin:4px 0 14px;display:flex;align-items:center;gap:10px}
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--sombra);margin-bottom:14px}
.card h3{font-size:15px;color:var(--verde-escuro);margin-bottom:10px}
.pill{display:inline-block;background:var(--verde-claro);color:#063524;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin:2px 4px 2px 0}
.semana-badge{background:linear-gradient(120deg,var(--verde),var(--verde-claro));color:#fff;border-radius:var(--radius);padding:16px 18px;text-align:center;margin-bottom:16px;box-shadow:var(--sombra)}
.semana-badge .lbl{font-size:12px;letter-spacing:2px;opacity:.9}
.semana-badge .dt{font-size:24px;font-weight:900;margin-top:4px}

/* ===== PERFIL ===== */
.perfil-top{text-align:center;padding:8px 0 4px}
.perfil-foto{width:116px;height:116px;border-radius:50%;object-fit:cover;border:4px solid var(--dourado);background:var(--cinza);margin:0 auto;display:block}
.perfil-nome{font-size:19px;font-weight:800;color:var(--verde-escuro);margin-top:10px}
.foto-acts{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.mini-btn{background:var(--verde-med);color:#fff;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600}
.mini-btn.sec{background:var(--cinza);color:var(--verde-escuro)}
.info-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef1ef;font-size:14px}
.info-row:last-child{border:none}
.info-row .k{color:#789;font-weight:600}
.info-row .v{font-weight:600;text-align:right}

/* ===== MUSICAS / ALFABETO ===== */
.alpha-bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.alpha-bar button{width:32px;height:32px;border-radius:8px;background:#fff;color:var(--verde-escuro);font-weight:800;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.alpha-bar button.active{background:var(--verde-med);color:#fff}
.alpha-bar button.has{border:1.5px solid var(--dourado)}
.song-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.song-row .s-ic{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--verde-med),var(--verde-claro));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.song-row .s-nm{flex:1;font-weight:700;font-size:15px;color:var(--verde-escuro)}
.song-row .s-ar{font-size:12px;color:#789;font-weight:500}
.star{font-size:20px;color:#d8d8d8;flex:none}
.star.on{color:var(--dourado)}
.search-box{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #dde;background:#fff;font-size:15px;margin-bottom:12px;outline:none}

/* ===== VISUALIZADOR DE MUSICA ===== */
.song-head{background:linear-gradient(120deg,var(--verde-escuro),var(--verde-med));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;position:relative}
.song-head .t{font-size:20px;font-weight:900}
.song-head .a{font-size:13px;opacity:.85;margin-top:2px}
.song-head .star{position:absolute;top:16px;right:16px;font-size:26px}
.tabs3{display:flex;gap:8px;margin-bottom:14px}
.tabs3 button{flex:1;padding:12px;border-radius:12px;background:#fff;color:var(--verde-escuro);font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs3 button .ic{font-size:18px}
.tabs3 button.active{background:var(--verde-med);color:#fff}
.sub-links{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub-links button{background:var(--cinza);color:var(--verde-escuro);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;border:1.5px solid transparent}
.sub-links button:active{border-color:var(--verde-claro)}
.cifra-box{background:#fffdf5;border:1px solid #efe7c9;border-radius:12px;padding:16px;font-family:'Courier New',monospace;font-size:14px;line-height:1.9;white-space:pre-wrap;color:#2b2b2b;overflow-x:auto}
.cifra-box .ch{color:var(--verde-med);font-weight:800}
.letra-box{background:#fff;border-radius:12px;padding:18px;font-size:16px;line-height:2;white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.zoom-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.zoom-bar button{height:34px;min-width:40px;padding:0 12px;border:1px solid #c9ced6;background:#fff;color:var(--verde-escuro);border-radius:8px;font-weight:800;font-size:15px;cursor:pointer}
.zoom-bar button.rst{font-weight:600;font-size:13px;color:#789}
.zoom-bar .zh{font-size:12px;color:#789;font-weight:600}
.fs-prev{background:#fffdf5;border:1px solid #efe7c9;border-radius:10px;padding:14px;margin-bottom:12px;color:#2b2b2b;text-align:center}
.fs-slider{width:100%;accent-color:var(--verde-med);margin:4px 0}
.fs-row{display:flex;align-items:center;justify-content:space-between;color:#789;font-size:13px}
.fs-row b{color:var(--verde-escuro);font-size:14px}
.yt-corner{position:relative;margin-bottom:12px}
.yt-btn{display:inline-flex;align-items:center;gap:8px;background:#ff0000;color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;font-weight:700;text-decoration:none}
.yt-embed{width:100%;aspect-ratio:16/9;border:none;border-radius:12px;margin-top:10px}

/* ===== PLAYER DE AUDIO ===== */
.player{background:linear-gradient(135deg,var(--verde-escuro),var(--verde-med));border-radius:var(--radius);padding:18px;color:#fff;box-shadow:var(--sombra)}
.player .pt{font-weight:800;font-size:16px;text-align:center;margin-bottom:4px}
.player .pa{font-size:12px;opacity:.8;text-align:center;margin-bottom:14px}
.player audio{width:100%;border-radius:30px}
.player-list{margin-top:14px}
.player-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.1);color:#fff;padding:11px 14px;border-radius:10px;margin-bottom:8px;font-size:13.5px;font-weight:600}
.player-list button.playing{background:var(--dourado);color:#3a2f00}

/* ===== ESCALA ===== */
.escala-wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:4px}
table.escala{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
table.escala th{background:var(--verde-escuro);color:#fff;padding:10px 8px;font-weight:700;position:sticky;top:0;text-align:left}
table.escala td{padding:9px 8px;border-bottom:1px solid #eef1ef}
table.escala tr.vigente{background:linear-gradient(90deg,rgba(241,196,15,.35),rgba(47,163,119,.18));box-shadow:inset 4px 0 0 var(--dourado)}
table.escala tr.vigente td{font-weight:700}
.vig-tag{display:inline-block;background:var(--dourado);color:#3a2f00;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px}
.me-tag{display:inline-block;background:var(--verde-med);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px}

/* ===== TOOLBAR EDITOR ===== */
.editor-tb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;background:linear-gradient(#fbfbfb,#eceff2);padding:6px 8px;border-radius:8px 8px 0 0;border:1px solid #c9ced6;border-bottom:none;position:relative}
.editor-tb button{min-width:34px;height:32px;padding:0 7px;border-radius:5px;background:transparent;color:#2b2b2b;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:3px;border:1px solid transparent;cursor:pointer}
.editor-tb button:hover{background:#fff;border-color:#c9ced6}
.editor-tb button:active{background:var(--verde-med);color:#fff;border-color:var(--verde-med)}
.editor-tb .sep{width:1px;align-self:stretch;background:#c9ced6;margin:3px 4px}
.editor-tb .edsel{height:32px;border:1px solid #c9ced6;border-radius:5px;background:#fff;color:var(--verde-escuro);font-size:12px;font-weight:600;padding:0 4px;cursor:pointer;max-width:92px}
.editor-tb .tom{font-size:12px;font-weight:700;color:var(--verde-escuro);background:#fff;border:1px solid #c9ced6;border-radius:5px;padding:0 8px;height:32px;display:flex;align-items:center;gap:4px}
.editor-tb .tom b{color:var(--dourado-esc);font-size:13px}
.cor-btn-swatch{display:block;width:15px;height:4px;border-radius:1px;background:#c0392b;margin-top:1px}
.cor-pop{position:absolute;top:42px;left:8px;z-index:40;background:#fff;border:1px solid #c9ced6;border-radius:8px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;grid-template-columns:repeat(8,1fr);gap:5px;width:max-content}
.cor-pop.show{display:grid}
.cor-pop i{width:20px;height:20px;border-radius:4px;cursor:pointer;border:1px solid rgba(0,0,0,.18)}
.cor-pop i:hover{transform:scale(1.15)}
.editor-rich{width:100%;min-height:260px;max-height:62vh;overflow:auto;border:1px solid #c9ced6;border-radius:0 0 8px 8px;padding:14px;font-family:'Courier New',monospace;font-size:14px;line-height:1.9;outline:none;white-space:pre-wrap;background:#fff;color:#2b2b2b}
.editor-rich:focus{border-color:var(--verde-claro);box-shadow:0 0 0 2px rgba(47,163,119,.15)}
.editor-rich:empty:before{content:attr(data-ph);color:#aab}
.editor-area{width:100%;min-height:180px;border:1px solid #c9ced6;border-radius:8px;padding:14px;font-family:'Courier New',monospace;font-size:14px;line-height:1.9;resize:vertical;outline:none}
.editor-area:focus{border-color:var(--verde-claro)}

/* ===== TOAST / NOTIFICACOES ===== */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--verde-escuro);color:#fff;padding:13px 20px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:var(--sombra);z-index:90;opacity:0;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notif-item{display:flex;gap:12px;background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:4px solid var(--verde-med)}
.notif-item.unread{border-left-color:var(--dourado);background:#fffdf3}
.notif-item .ni-ic{font-size:22px}
.notif-item .ni-t{font-weight:800;font-size:14px;color:var(--verde-escuro)}
.notif-item .ni-b{font-size:13px;color:#556;margin-top:3px}
.notif-item .ni-dt{font-size:11px;color:#9aa;margin-top:5px}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.2s}
.modal-bg.show{opacity:1;visibility:visible}
.modal{background:#fff;border-radius:var(--radius);padding:22px;width:100%;max-width:420px;box-shadow:var(--sombra);max-height:88vh;overflow-y:auto}
.modal h3{color:var(--verde-escuro);margin-bottom:14px;font-size:17px}
.modal .field label{color:var(--verde-escuro)}
.modal .field input,.modal .field select,.modal .field textarea{background:#fff;border:1px solid #ccd;color:var(--txt)}
.modal-acts{display:flex;gap:10px;margin-top:16px}
.modal-acts .btn{flex:1}
.btn-dark{background:var(--verde-med);color:#fff}
.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border-radius:50%;background:var(--dourado);color:#3a2f00;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:45;font-weight:300}
.admin-tag{background:var(--dourado);color:#3a2f00;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.empty{text-align:center;color:#9aa;padding:40px 20px;font-size:14px}
.empty .big{font-size:46px;margin-bottom:10px;opacity:.5}

/* ===== BOAS-VINDAS / ONBOARDING ===== */
.bv{position:fixed;inset:0;z-index:120;background:linear-gradient(160deg,var(--verde-escuro),var(--verde) 60%,var(--verde-med));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px 70px;overflow-y:auto}
.bv-card{width:100%;max-width:440px;text-align:center}
.bv-logo{width:92px;height:92px;margin:0 auto 14px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.bv-step{display:none;animation:fade .3s}
.bv-step.active{display:block}
.bv-ic{font-size:62px;margin-bottom:10px}
.bv-h{font-size:22px;font-weight:900;margin-bottom:10px;letter-spacing:.3px}
.bv-p{font-size:15px;line-height:1.65;opacity:.92;margin-bottom:8px}
.bv-list{text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 18px;margin-top:8px}
.bv-list .li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;margin-bottom:12px}
.bv-list .li:last-child{margin-bottom:0}
.bv-list .li .e{font-size:22px;flex:none;line-height:1}
.bv-list .li b{color:var(--dourado)}
.bv-dots{display:flex;gap:8px;justify-content:center;margin:22px 0 16px}
.bv-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s}
.bv-dots span.on{background:var(--dourado);width:24px;border-radius:5px}
.bv-nav{display:flex;gap:10px}
.bv-nav .btn{flex:1}
.bv-skip{position:absolute;top:18px;right:20px;font-size:13px;color:rgba(255,255,255,.85);background:none;font-weight:600}
</style>

<style id="ibnmCorrecoes">
/* menu lateral fechado não deixa sombra na borda da tela */
.sidemenu{box-shadow:none}
.sidemenu.show{box-shadow:6px 0 24px rgba(0,0,0,.3)}
/* versão: só na tela de login (no app ela já aparece no rodapé do menu) */
#appShell:not(.hidden) ~ .ver-foot{display:none}
/* faixa AO VIVO empurra a barra verde em vez de cobri-la */
body.ao-vivo .topbar{top:var(--ibnm-vivo,34px)}
body.ao-vivo #appShell{padding-top:var(--ibnm-vivo,34px)}
/* filtro A–Z: o botão "Tudo" cabe inteiro */
.alpha-bar button{min-width:32px;width:auto;padding:0 6px}
/* nomes longos de música não estouram a linha */
.song-row .s-nm,.song-row .s-ar{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* barra de tom e rolagem das músicas */
.zoom-bar .mm-tom{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px;border:1px solid var(--dourado-esc);background:#fffbea;border-radius:8px;font-size:13px;color:var(--verde-escuro)}
.zoom-bar .mm-tom button{border:0;background:none;min-width:30px;height:30px;font-size:17px}
.zoom-bar .mm-tom b{color:#8a6a00}
.zoom-bar .mm-tom small{color:#789}
.zoom-bar .mm-rol{background:var(--verde-med)!important;color:#fff!important;border-color:var(--verde-med)!important;font-size:13px!important}
.cc-scrollbar .pp{width:auto!important;padding:0 14px!important;font-size:14px!important}
/* foco visível para quem usa teclado */
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--dourado);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============================================================
   MINISTERIO DE MUSICA IBNM - App do Usuario (prototipo)
   Persistencia local (localStorage). Pontos de integracao
   para Google Login / Google Drive marcados com [INTEGRACAO].
============================================================ */
const VERSION = 'v1.1.0';
const DB_KEY = 'ibnm_mm_db_v1';
const SES_KEY = 'ibnm_mm_sessao';
const LOGO = document.getElementById('logoTpl').innerHTML;

/* ---------- Banco de dados local ---------- */
const defaultDB = {
  usuarios: [],
  musicas: [],
  playlist: { inicio:'', fim:'', musicas:[], publicada:false },
  escala: { colunas:[], linhas:[] },  // linhas: [{periodoInicio,periodoFim,celulas:{col:valor}}]
  notificacoes: {},  // por email -> [ {id,ic,titulo,corpo,data,lida} ]
  favoritos: {}      // por email -> [idMusica]
};
function loadDB(){ try{ return Object.assign({}, defaultDB, JSON.parse(localStorage.getItem(DB_KEY))||{}); }catch(e){ return JSON.parse(JSON.stringify(defaultDB)); } }
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
let DB = loadDB();

/* ---------- Sessao ---------- */
function getSessao(){ try{ return JSON.parse(localStorage.getItem(SES_KEY)); }catch(e){ return null; } }
function setSessao(email){ localStorage.setItem(SES_KEY, JSON.stringify({email})); }
function logout(){ localStorage.removeItem(SES_KEY); location.reload(); }
function usuarioAtual(){ const s=getSessao(); return s? DB.usuarios.find(u=>u.email===s.email) : null; }
function ehAdmin(){ const u=usuarioAtual(); return u && u.admin; }

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hashSenha(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)+s.charCodeAt(i); return 'h'+(h>>>0).toString(36); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3200); }
function fmtData(iso){ if(!iso) return ''; const d=new Date(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function fmtDataHora(iso){ const d=new Date(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const AVATAR_PADRAO = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="#145c43"/><circle cx="60" cy="46" r="24" fill="#fff"/><path d="M20 112c0-24 18-36 40-36s40 12 40 36" fill="#fff"/></svg>');

/* ---------- Marca d'agua de notas musicais ---------- */
(function(){ const notas=['\u266A','\u266B','\u2669','\u266C','\uD834\uDD1E','\u266D'];
  let h=''; for(let i=0;i<26;i++){ const sz=22+Math.random()*54; h+='<span style="top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;font-size:'+sz+'px;transform:rotate('+(Math.random()*60-30)+'deg)">'+notas[i%notas.length]+'</span>'; }
  $('#wm').innerHTML=h;
})();
$('#verFoot').textContent = 'Ministério de Música IBNM — '+VERSION;
</script>

function maskTel(el){ let v=el.value.replace(/\D/g,'').slice(0,11);
  let o=''; if(v.length>0)o='( '+v.slice(0,2); if(v.length>=2)o+=' ) '; if(v.length>2)o+=v.slice(2,7); if(v.length>7)o+='-'+v.slice(7,11); el.value=o; }
function checaSenha(s){ const r={len:s.length>=8,up:/[A-Z]/.test(s),num:/[0-9]/.test(s),spec:/[^A-Za-z0-9]/.test(s)};
  document.querySelectorAll('#pwdRules li').forEach(li=>li.classList.toggle('ok',r[li.dataset.r])); return r; }
function senhaValida(s){ const r=checaSenha(s); return r.len&&r.up&&r.num&&r.spec; }
/* olho da senha: mostra/oculta o que foi digitado (login) */
function olhoSenha(id,btn){
  const i=document.getElementById(id); if(!i) return;
  const visivel=i.type==='text';
  i.type=visivel?'password':'text';
  if(btn){ btn.textContent=visivel?'👁️':'🙈'; btn.title=visivel?'Mostrar senha':'Ocultar senha'; btn.setAttribute('aria-pressed', visivel?'false':'true'); }
  try{ i.focus(); }catch(_){}
}
function erro(id,msg){ $('#'+id).innerHTML='<div class="err-msg">'+esc(msg)+'</div>'; }
</script>
<script>
/* ============== LOGICA DE AUTENTICACAO ============== */
function fazerLogin(){
  const email=$('#liEmail').value.trim().toLowerCase(), senha=$('#liSenha').value;
  if(!email||!senha) return erro('loginErr','Preencha e-mail e senha.');
  const u=DB.usuarios.find(x=>x.email===email);
  if(!u) return erro('loginErr','Usuário não encontrado.');
  if(u.senhaHash!==hashSenha(senha)) return erro('loginErr','Senha incorreta.');
  setSessao(email); iniciarApp();
}

function fazerCadastro(){
  const nome=$('#cNome').value.trim(), nasc=$('#cNasc').value, email=$('#cEmail').value.trim().toLowerCase();
  const tel=$('#cTel').value.trim(), wpp=$('#cWpp').checked, senha=$('#cSenha').value, senha2=$('#cSenha2').value;
  const vocal=[...document.querySelectorAll('.cbVocal:checked')].map(c=>c.value);
  const instr=[...document.querySelectorAll('.cbInstr:checked')].map(c=>c.value);
  if(!nome) return erro('cadErr','Informe seu nome completo.');
  if(!nasc) return erro('cadErr','Informe sua data de nascimento.');
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)) return erro('cadErr','E-mail inválido.');
  if(tel.replace(/\D/g,'').length<10) return erro('cadErr','Telefone incompleto.');
  if(!vocal.length && !instr.length) return erro('cadErr','Selecione ao menos uma função no Ministério.');
  if(!senhaValida(senha)) return erro('cadErr','A senha não cumpre os requisitos.');
  if(senha!==senha2) return erro('cadErr','As senhas não conferem.');
  if(DB.usuarios.find(u=>u.email===email)) return erro('cadErr','Já existe conta com este e-mail.');
  const primeiro = DB.usuarios.length===0; // primeiro cadastro vira ADM
  DB.usuarios.push({ email, nome, nasc, tel, wpp, vocal, instr, senhaHash:hashSenha(senha),
    foto:'', admin:primeiro, origem:'local', criado:new Date().toISOString() });
  DB.notificacoes[email]=[]; DB.favoritos[email]=[]; saveDB();
  setSessao(email);
  if(primeiro) notificar(email,'👑','Você é o Administrador','Como primeiro cadastro, você recebeu acesso de ADM.');
  notificar(email,'🎵','Bem-vindo(a)!','Seu cadastro no Ministério de Música IBNM foi criado.');
  iniciarApp();
}

/* [INTEGRACAO] Login com Google.
   Em producao usar Google Identity Services (GIS) com seu CLIENT_ID OAuth.
   Aqui simulamos trazendo dados de perfil do Google para o cadastro. */
function loginGoogle(){
  const nome = prompt('Simulação do Login Google.\nNa versão final abrirá a conta Google real.\n\nNome (como viria do Google):','');
  if(!nome) return;
  const email=(prompt('E-mail da conta Google:','')||'').trim().toLowerCase();
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)) return toast('E-mail Google inválido.');
  let u=DB.usuarios.find(x=>x.email===email);
  if(!u){ const primeiro=DB.usuarios.length===0;
    u={ email, nome, nasc:'', tel:'', wpp:false, vocal:[], instr:[], senhaHash:'', foto:'',
       admin:primeiro, origem:'google', criado:new Date().toISOString() };
    DB.usuarios.push(u); DB.notificacoes[email]=[]; DB.favoritos[email]=[];
    notificar(email,'🎵','Bem-vindo(a)!','Conta criada via Google. Complete seu perfil (função no MM).');
  }
  saveDB(); setSessao(email); iniciarApp();
  if(!u.vocal.length && !u.instr.length) setTimeout(()=>{ toast('Complete sua função no Ministério no seu perfil.'); go('perfil'); },600);
}

/* Recuperacao / confirmacao por e-mail (simulada) */
function telaRecupera(){
  $('#authScreens').innerHTML = `
  <div class="scr-auth">
    <div class="logo-wrap"><div class="logo-emblema" style="width:88px;height:88px">${LOGO}</div></div>
    <div class="auth-card"><h2>Recuperar senha</h2>
      <div class="sub">Enviaremos um link de redefinição para seu e-mail</div>
      <div id="recErr"></div>
      <div class="field"><label>E-mail cadastrado</label><input type="email" id="recEmail" placeholder="voce@email.com"></div>
      <button class="btn btn-primary" onclick="enviarRecupera()">Enviar link</button>
      <div class="auth-switch"><a onclick="telaLogin()">Voltar ao login</a></div>
    </div></div>`;
}
function enviarRecupera(){ const email=$('#recEmail').value.trim().toLowerCase();
  const u=DB.usuarios.find(x=>x.email===email);
  if(!u) return erro('recErr','E-mail não encontrado.');
  // [INTEGRACAO] Aqui o backend enviaria o e-mail de redefinicao.
  $('#recErr').innerHTML='<div class="ok-msg">Enviamos um link de redefinição para '+esc(email)+'. Verifique sua caixa de entrada.</div>';
}

  const u=usuarioAtual();
  let h=`<div class="sm-head"><div class="logo-emblema">${LOGO}</div>

  MENU.forEach(m=>{
    if(m.sub){ h+=`<button class="sm-item" onclick="toggleSub(this)"><span class="ic">${m.ic}</span>${m.nm}<span class="ar">\u25B6</span></button><div class="sm-sub">`;
      m.sub.forEach(s=>{ if(s.grupo) h+=`<div class="sm-grupo" style="font-size:10.5px;font-weight:800;color:#8a9;letter-spacing:1.1px;text-transform:uppercase;padding:9px 14px 3px">${s.grupo}</div>`;
        h+=`<button onclick="go('${s.id}'${s.arg?`, '${s.arg}'`:''})"><span>${s.ic}</span>${s.nm}</button>`; });
      h+=`</div>`;
    } else h+=`<button class="sm-item" onclick="go('${m.id}')"><span class="ic">${m.ic}</span>${m.nm}</button>`;
  });
  if(u.admin) h+=`<button class="sm-item" onclick="go('admin')"><span class="ic">\u2699\uFE0F</span>Painel do ADM</button>`;

    <div class="sm-foot">Ministério de Música IBNM<br>${VERSION}</div>`;

}
function toggleSub(btn){ btn.classList.toggle('open'); btn.nextElementSibling.classList.toggle('open'); }
function toggleMenu(open){ $('#sidemenu').classList.toggle('show',open); $('#overlay').classList.toggle('show',open); }

function go(page,arg){ toggleMenu(false); window.scrollTo(0,0);
  const u=usuarioAtual(); if(!u) return;
  if(page==='ajuda'){ telaBoasVindas(false); return; }
  const fn = ROTAS[page]; $('#content').innerHTML = fn? fn(arg) : '<div class="empty">Página não encontrada.</div>';
  atualizaBadge();
}

function iniciarApp(){
  const u=usuarioAtual(); if(!u){ telaLogin(); return; }

  $('#topAvatar').src = u.foto || AVATAR_PADRAO;

}

<script>
/* ============== MUSICAS (alfabeto + lista) ============== */
let filtroLetra='TODAS', filtroBusca='';
function ehFav(id){ const u=usuarioAtual(); return (DB.favoritos[u.email]||[]).includes(id); }
function toggleFav(id,ev){ if(ev) ev.stopPropagation(); const u=usuarioAtual();
  if(!DB.favoritos[u.email]) DB.favoritos[u.email]=[];
  const arr=DB.favoritos[u.email], i=arr.indexOf(id);
  if(i<0){ arr.push(id); toast('Adicionada aos favoritos \u2B50'); } else { arr.splice(i,1); toast('Removida dos favoritos'); }
  saveDB(); if(musicaAberta===id) abrirMusica(id,abaAtual); else go(paginaMusicas); }

let paginaMusicas='musicas';
ROTAS.musicas = function(){ paginaMusicas='musicas'; return renderListaMusicas(false); };
ROTAS.favoritos = function(){ paginaMusicas='favoritos'; return renderListaMusicas(true); };

function renderListaMusicas(soFav){
  const adm=ehAdmin(); const u=usuarioAtual();
  let musicas = DB.musicas.slice();
  if(soFav){ const fv=DB.favoritos[u.email]||[]; musicas=musicas.filter(m=>fv.includes(m.id)); }
  const letras='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const comLetra=new Set(musicas.map(m=>(m.titulo[0]||'#').toUpperCase()));
  const alpha = `<div class="alpha-bar"><button class="${filtroLetra==='TODAS'?'active':''}" onclick="setLetra('TODAS')">Tudo</button>`+
    letras.map(l=>`<button class="${filtroLetra===l?'active':''} ${comLetra.has(l)?'has':''}" onclick="setLetra('${l}')">${l}</button>`).join('')+`</div>`;
  return `<div class="page"><div class="page-ttl">${soFav?'\u2B50 Favoritos':'\uD83C\uDFB5 Músicas'}</div>
    <input class="search-box" id="buscaMusica" placeholder="\uD83D\uDD0D Buscar música ou artista..." value="${esc(filtroBusca)}" oninput="buscarMusicas(this.value)">
    ${alpha}
    ${adm&&!soFav? `<button class="mini-btn" style="margin-bottom:12px" onclick="modalNovaMusica()">\u2795 Adicionar música</button>`:''}
    <div id="listaMusicas">${listaMusicasHTML(soFav)}</div></div>`;
}
function listaMusicasHTML(soFav){
  const u=usuarioAtual(); let musicas=DB.musicas.slice();
  if(soFav){ const fv=DB.favoritos[u.email]||[]; musicas=musicas.filter(m=>fv.includes(m.id)); }
  let vis=musicas.filter(m=>{
    const okL = filtroLetra==='TODAS' || (m.titulo[0]||'').toUpperCase()===filtroLetra;
    const okB = !filtroBusca || (m.titulo+' '+(m.artista||'')).toLowerCase().includes(filtroBusca.toLowerCase());
    return okL&&okB; });
  vis.sort((a,b)=>a.titulo.localeCompare(b.titulo,'pt'));
  return vis.length? vis.map(m=>`<div class="song-row" onclick="abrirMusica('${m.id}')">
      <div class="s-ic">\uD83C\uDFB5</div><div style="flex:1"><div class="s-nm">${esc(m.titulo)}</div><div class="s-ar">${esc(m.artista||'')}</div></div>
      <span class="star ${ehFav(m.id)?'on':''}" onclick="toggleFav('${m.id}',event)">\u2605</span></div>`).join('')
    : `<div class="empty"><div class="big">${soFav?'\u2B50':'\uD83C\uDFB5'}</div>${soFav?'Você ainda não tem favoritos. Toque na estrela de uma música.':'Nenhuma música encontrada.'}</div>`;
}
function buscarMusicas(val){ filtroBusca=val; const soFav=(typeof paginaMusicas!=='undefined' && paginaMusicas==='favoritos'); const el=document.getElementById('listaMusicas'); if(el) el.innerHTML=listaMusicasHTML(soFav); }
function setLetra(l){ filtroLetra=l; go(paginaMusicas); }

/* ============== VISUALIZADOR DA MUSICA ============== */
let musicaAberta=null, abaAtual='cifra';
function abrirMusica(id,aba){ musicaAberta=id; abaAtual=aba||'cifra';
  toggleMenu(false); window.scrollTo(0,0);
  $('#content').innerHTML = renderMusica(); }

function renderMusica(){
  const m=DB.musicas.find(x=>x.id===musicaAberta); if(!m) return go(paginaMusicas);
  const adm=ehAdmin(); const fav=ehFav(m.id);
  let corpo='';
  if(abaAtual==='cifra'){
    const yt = m.youtube? `<div class="yt-corner"><a class="yt-btn" href="${esc(m.youtube)}" target="_blank">\u25B6 Ver no YouTube</a></div>`:'';
    corpo = `<div class="sub-links">
        <button onclick="abrirMusica('${m.id}','letra')">\uD83D\uDCDD Somente letra</button>
        <button onclick="abrirMusica('${m.id}','audio')">\uD83C\uDFA7 Ouvir áudio</button></div>
      ${yt}
      ${adm?`<button class="mini-btn" style="margin-bottom:10px" onclick="editorCifra('${m.id}')">\u270F\uFE0F Editar cifra</button>${m.cifra?`<button class="mini-btn sec" style="margin-bottom:10px;margin-left:6px" onclick="excluirMusicaCifra('${m.id}')">\uD83D\uDDD1\uFE0F Excluir cifra</button>`:''}`:''}
      <div class="zoom-bar"><button type="button" onclick="zoomView(-1)">A−</button><span class="zh">Tamanho</span><button type="button" onclick="zoomView(1)">A+</button><button type="button" class="rst" onclick="zoomView(0)">Resetar</button></div>
      <div class="cifra-box" id="zoomTarget" data-base="14">${m.cifra? renderCifraView(m.cifra) : '<span style="color:#aab">Cifra ainda não cadastrada.</span>'}</div>`;
  } else if(abaAtual==='letra'){
    corpo = `<div class="sub-links">
        <button onclick="abrirMusica('${m.id}','cifra')">\uD83C\uDFBC Ver cifra</button>
        <button onclick="abrirMusica('${m.id}','audio')">\uD83C\uDFA7 Ouvir áudio</button></div>
      <div class="zoom-bar"><button type="button" onclick="zoomView(-1)">A−</button><span class="zh">Tamanho</span><button type="button" onclick="zoomView(1)">A+</button><button type="button" class="rst" onclick="zoomView(0)">Resetar</button></div>
      <div class="letra-box" id="zoomTarget" data-base="16">${m.letra? esc(m.letra) : '<span style="color:#aab">Letra ainda não cadastrada.</span>'}</div>`;
  } else {
    corpo = `<div class="sub-links">
        <button onclick="abrirMusica('${m.id}','cifra')">\uD83C\uDFBC Ver cifra</button>
        <button onclick="abrirMusica('${m.id}','letra')">\uD83D\uDCDD Somente letra</button></div>
      ${renderPlayer(m)}`;
  }
  return `<div class="page">
    <button class="mini-btn sec" style="margin-bottom:12px" onclick="go('${paginaMusicas}')">\u2190 Voltar</button>
    <div class="song-head"><div class="t">${esc(m.titulo)}</div><div class="a">${esc(m.artista||'')}</div>
      <span class="star ${fav?'on':''}" onclick="toggleFav('${m.id}')">\u2605</span></div>
    <div class="tabs3">
      <button class="${abaAtual==='cifra'?'active':''}" onclick="abrirMusica('${m.id}','cifra')"><span class="ic">\uD83C\uDFBC</span>Cifra</button>
      <button class="${abaAtual==='letra'?'active':''}" onclick="abrirMusica('${m.id}','letra')"><span class="ic">\uD83D\uDCDD</span>Letra</button>
      <button class="${abaAtual==='audio'?'active':''}" onclick="abrirMusica('${m.id}','audio')"><span class="ic">\uD83C\uDFA7</span>Áudio</button></div>
    ${corpo}</div>`;
}
function realcaCifra(txt){ // realca acordes (linhas com padrao de acordes)
  return esc(txt).split('\n').map(l=>{
    if(/^[\s]*([A-G][#b]?(m|maj|min|sus|dim|aug|add)?[0-9]?(\/[A-G][#b]?)?[\s]*)+$/.test(l) && l.trim())
      return '<span class="ch">'+l+'</span>'; return l; }).join('\n');
}
function renderCifraView(c){ if(!c) return ''; if(/<[a-z!/][\s\S]*>/i.test(c)) return limparCifraHtml(c); return realcaCifra(c); }

/* ============== PLAYER (audios do Google Drive) ============== */
function driveUrl(id){ return 'https://drive.google.com/uc?export=download&id='+id; }
function renderPlayer(m){
  const audios=m.audios||[];
  if(!audios.length) return `<div class="empty"><div class="big">\uD83C\uDFA7</div>Nenhum áudio disponível ainda.</div>`;
  const primeiro=audios[0];
  return `<div class="player">
    <div class="pt" id="plNome">${esc(primeiro.nome)}</div><div class="pa">${esc(m.titulo)}</div>
    <audio id="plAudio" controls autoplay src="${esc(primeiro.url)}"></audio>
    ${audios.length>1? `<div class="player-list">${audios.map((a,i)=>`<button class="${i===0?'playing':''}" onclick="tocar('${esc(a.url)}',this,'${esc(a.nome)}')">\u25B6 ${esc(a.nome)}</button>`).join('')}</div>`:''}
  </div>`;
}
function tocar(url,btn,nome){ const a=$('#plAudio'); a.src=url; a.play(); $('#plNome').textContent=nome;
  document.querySelectorAll('.player-list button').forEach(b=>b.classList.remove('playing')); btn.classList.add('playing'); }
</script>
<script>
/* ============== EDITOR DE CIFRA (somente ADM) ============== */

const NOTAS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CORES=['#000000','#434343','#666666','#999999','#b7b7b7','#ffffff','#c0392b','#e74c3c','#e67e22','#f1c40f','#2ecc71','#27ae60','#1abc9c','#3498db','#2980b9','#8e44ad','#9b59b6','#145c43','#0b3d2e','#c9a200','#d35400','#16a085','#2c3e50','#7f8c8d'];
let _edUndo=[], _edRedo=[], _edCur='', _edTimer=null;
function edEl(){ return document.getElementById('edCifra'); }
function cifraInicialHtml(c){ if(!c) return ''; if(/<[a-z!/][\s\S]*>/i.test(c)) return limparCifraHtml(c); return esc(c).replace(/\n/g,'<br>'); }
function limparCifraHtml(html){
  const box=document.createElement('div'); box.innerHTML=html||'';
  const ok={B:1,STRONG:1,I:1,EM:1,U:1,SPAN:1,FONT:1,DIV:1,BR:1,P:1};
  (function limpa(no){
    [...no.childNodes].forEach(n=>{
      if(n.nodeType===1){
        if(n.tagName==='SCRIPT'||n.tagName==='STYLE'){ n.remove(); return; }
        if(!ok[n.tagName]){ while(n.firstChild) no.insertBefore(n.firstChild,n); n.remove(); return; }
        [...n.attributes].forEach(a=>{
          const nm=a.name.toLowerCase();
          if(n.tagName==='FONT' && (nm==='color'||nm==='size'||nm==='face')) return;
          if(nm==='style'){ const s=a.value||''; let keep='';
            const g=(re)=>{ const mm=s.match(re); return mm? mm[1].trim().replace(/["'`\\]/g,'') : ''; };
            const col=g(/color\s*:\s*([^;]+)/i); if(col) keep+='color:'+col+';';
            const ff=g(/font-family\s*:\s*([^;]+)/i); if(ff) keep+='font-family:'+ff+';';
            const fs=g(/font-size\s*:\s*([^;]+)/i); if(fs) keep+='font-size:'+fs+';';
            const fw=g(/font-weight\s*:\s*([^;]+)/i); if(fw) keep+='font-weight:'+fw+';';
            const fsy=g(/font-style\s*:\s*([^;]+)/i); if(fsy) keep+='font-style:'+fsy+';';
            const td=g(/text-decoration[a-z-]*\s*:\s*([^;]+)/i); if(td) keep+='text-decoration:'+td+';';
            n.removeAttribute('style'); if(keep) n.setAttribute('style',keep); return; }
          n.removeAttribute(a.name);
        });
        limpa(n);
      } else if(n.nodeType!==3){ n.remove(); }
    });
  })(box);
  return box.innerHTML;
}
function getCifraHtml(){ const el=edEl(); return el? limparCifraHtml(el.innerHTML) : ''; }
function edInit(){ const el=edEl(); _edCur=el? el.innerHTML : ''; _edUndo=[]; _edRedo=[]; }
function edCommit(){ const el=edEl(); if(!el) return; if(el.innerHTML!==_edCur){ _edUndo.push(_edCur); if(_edUndo.length>150)_edUndo.shift(); _edRedo=[]; _edCur=el.innerHTML; } }
function edOnInput(){ clearTimeout(_edTimer); _edTimer=setTimeout(()=>{ edCommit(); atualizaTom(); },350); }
function edUndo(ev){ if(ev)ev.preventDefault(); const el=edEl(); if(!el) return; edCommit(); if(!_edUndo.length){ toast('Nada para desfazer'); return; } _edRedo.push(_edCur); _edCur=_edUndo.pop(); el.innerHTML=_edCur; el.focus(); atualizaTom(); }
function edRedo(ev){ if(ev)ev.preventDefault(); const el=edEl(); if(!el) return; edCommit(); if(!_edRedo.length){ toast('Nada para refazer'); return; } _edUndo.push(_edCur); _edCur=_edRedo.pop(); el.innerHTML=_edCur; el.focus(); atualizaTom(); }
function fmt(ev,tipo){ ev.preventDefault(); const el=edEl(); if(!el) return; el.focus(); edCommit();
  if(tipo==='clear'){ if(confirm('Limpar toda a cifra?')){ el.innerHTML=''; edCommit(); atualizaTom(); } return; }
  if(tipo==='secao'){ const sel=(window.getSelection&&String(window.getSelection()))||''; document.execCommand('insertText',false,'['+(sel||'Refrão')+']'); edCommit(); return; }
  const cmd={bold:'bold',italic:'italic',underline:'underline'}[tipo]; if(cmd) document.execCommand(cmd,false,null); edCommit();
}
function togglePaleta(ev){ ev.preventDefault(); const pop=document.getElementById('corPop'); if(!pop) return;
  if(!pop.dataset.feito){ pop.innerHTML=CORES.map(c=>`<i style="background:${c}" onmousedown="aplicarCor(event,'${c}')"></i>`).join(''); pop.dataset.feito='1'; }
  pop.classList.toggle('show'); const el=edEl(); if(el) el.focus();
}
function aplicarCor(ev,cor){ ev.preventDefault(); const el=edEl(); if(!el) return; el.focus(); edCommit();
  try{ document.execCommand('styleWithCSS',false,true); }catch(e){} document.execCommand('foreColor',false,cor);
  const sw=document.getElementById('corAtual'); if(sw) sw.style.background=cor;
  const pop=document.getElementById('corPop'); if(pop) pop.classList.remove('show'); edCommit();
}
function aplicarFonte(sel){ const el=edEl(); if(!el||!sel.value) return; el.focus(); edCommit(); try{ document.execCommand('styleWithCSS',false,true); }catch(e){} document.execCommand('fontName',false,sel.value); edCommit(); sel.selectedIndex=0; }
function aplicarTamanho(sel){ const el=edEl(); if(!el||!sel.value) return; el.focus(); edCommit(); document.execCommand('fontSize',false,sel.value); edCommit(); sel.selectedIndex=0; }
function _transpToken(tok,passo){ const mt=tok.match(/^([A-G][#b]?)(.*)$/); if(!mt) return tok; let n=mt[1].replace('b','#'); let i=NOTAS.indexOf(n); if(i<0) return tok; return NOTAS[(i+passo+12)%12]+mt[2]; }
function transpor(ev,passo){ ev.preventDefault(); const el=edEl(); if(!el) return; edCommit();
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null); const ns=[]; while(w.nextNode()) ns.push(w.currentNode);
  const re=/(^|[\s(\[])([A-G][#b]?(?:m|maj|min|sus|dim|aug|add|7|6|9|11|13|2|4|5)*(?:\/[A-G][#b]?)?)(?=$|[\s)\]])/g;
  ns.forEach(tn=>{ tn.nodeValue=tn.nodeValue.replace(re,(mm,pre,ch)=> pre+_transpToken(ch,passo)); });
  edCommit(); atualizaTom(); toast(passo>0?'Subiu meio tom':'Desceu meio tom');
}
function atualizaTom(){ const el=edEl(); const alvo=document.getElementById('tomAtual'); if(!el||!alvo) return;
  const mt=(el.textContent||'').match(/(?:^|[\s(\[])([A-G][#b]?(?:m|maj|min|sus|dim|aug)?)(?=$|[\s)\]])/);
  alvo.textContent = mt? mt[1] : '?';
}
function edBindEditor(){ const el=edEl(); if(!el) return; edInit(); atualizaTom();
  el.addEventListener('input', edOnInput);
  el.addEventListener('paste', function(e){ e.preventDefault(); const t=((e.clipboardData||window.clipboardData).getData('text')||''); document.execCommand('insertText',false,t); });
  el.addEventListener('keydown', function(e){ if(e.ctrlKey||e.metaKey){ const k=e.key.toLowerCase(); if(k==='z'){ e.preventDefault(); edUndo(); } else if(k==='y'){ e.preventDefault(); edRedo(); } } });
}
function addAudio(id){ const m=DB.musicas.find(x=>x.id===id); const nome=$('#edAudNome').value.trim(); let v=$('#edAudUrl').value.trim();
  if(!nome||!v) return toast('Informe nome e link/ID.');
  let url=v; const mt=v.match(/[-\w]{25,}/); if(!/^https?:/.test(v) && mt) url=driveUrl(v); else if(mt && v.includes('drive.google')) url=driveUrl(mt[0]);
  m.audios=m.audios||[]; m.audios.push({nome,url}); saveDB(); editorCifra(id); }
function removerAudio(id,i){ const m=DB.musicas.find(x=>x.id===id); m.audios.splice(i,1); saveDB(); editorCifra(id); }

  m.titulo=$('#edTit').value.trim()||m.titulo; m.artista=$('#edArt').value.trim(); m.youtube=$('#edYt').value.trim();
  m.cifra=getCifraHtml(); m.letra=$('#edLetra').value;
  if(publicar){ const jaPub=m.publicada; m.publicada=true; saveDB();
    if(!jaPub){ notificarTodos('\uD83C\uDFBC','Nova música disponível','"'+m.titulo+'" foi publicada no app. Confira a cifra, letra e áudio!'); }
    toast('Publicado!'+((typeof APP_CFG!=='undefined'&&APP_CFG.notif_cfg&&APP_CFG.notif_cfg.auto_musica)?' Todos foram notificados.':' Avise pela Central de avisos quando quiser.')); abrirMusica(id,'cifra');
  } else { saveDB(); toast('Rascunho salvo.'); }

<script>
/* ============== ESCALA SEMANAL ============== */
/* Cada linha tem periodoInicio/periodoFim (ISO). A linha vigente e destacada.
   A verificacao de "vira na segunda 00:01" e feita comparando a data atual. */
function segundaDaSemana(d){ d=new Date(d); const dia=d.getDay(); const diff=(dia===0?-6:1-dia); d.setDate(d.getDate()+diff); d.setHours(0,1,0,0); return d; }
function escalaAtiva(){ return (DB.escala && DB.escala.colunas && DB.escala.colunas.length) ? DB.escala : (typeof ESCALA_SEED!=='undefined'? ESCALA_SEED : {colunas:[],linhas:[]}); }
function linhaVigenteIdx(){
  const E=escalaAtiva();
  const hoje=new Date(); const seg=segundaDaSemana(hoje);
  for(let i=0;i<E.linhas.length;i++){ const l=E.linhas[i];
    if(l.periodoInicio){ const ini=new Date(l.periodoInicio); const fim=l.periodoFim?new Date(l.periodoFim):new Date(ini.getTime()+6*864e5);
      if(hoje>=ini && hoje<=new Date(fim.getTime()+864e5)) return i; }
  }
  // fallback: casa pela segunda-feira da semana
  for(let i=0;i<E.linhas.length;i++){ const l=E.linhas[i];
    if(l.periodoInicio && segundaDaSemana(l.periodoInicio).getTime()===seg.getTime()) return i; }
  return -1;
}
/* Normaliza texto (sem acentos, minúsculo) para comparação segura */
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
/* Verifica se o NOME do usuário aparece na célula (prioriza nome, com limite de palavra) */
function nomeNaCelula(valor,u){
  if(!valor) return false;
  const v=norm(valor); const full=norm(u.nome).trim(); if(!full) return false;
  const first=full.split(' ')[0];
  const tokens=v.split(/[^a-z0-9]+/).filter(Boolean);
  if(v.includes(full)) return true;        // nome completo contido
  if(tokens.includes(first)) return true;   // primeiro nome como palavra inteira
  return false;
}
/* Colunas (postos/dias) em que o usuário aparece na linha informada */
function colsDoUsuarioNaLinha(l,u){
  const cols=[]; for(const c of escalaAtiva().colunas){ if(nomeNaCelula(l.celulas[c],u)) cols.push(c); } return cols;
}
function usuarioNaEscalaVigente(u){
  const idx=linhaVigenteIdx(); if(idx<0) return null; const l=escalaAtiva().linhas[idx]; if(!l) return null;
  const cols=colsDoUsuarioNaLinha(l,u);
  return cols.length? cols.join(', ') : null;
}
ROTAS.escala = function(){
  const adm=ehAdmin(); const idx=linhaVigenteIdx(); const u=usuarioAtual();
  const E=escalaAtiva();
  if(!E.colunas.length){
    return `<div class="page"><div class="page-ttl">\uD83D\uDCCB Escala do Ministério</div>
      ${adm?`<button class="mini-btn" style="margin-bottom:14px" onclick="$('#inpEscala').click()">\uD83D\uDCC4 Importar escala (Excel)</button><input type="file" id="inpEscala" accept=".xlsx,.xls,.csv" class="hidden" onchange="importarEscala(this)">`:''}
      <div class="empty"><div class="big">\uD83D\uDCCB</div>Nenhuma escala publicada ainda.</div></div>`;
  }
  const naEscala=usuarioNaEscalaVigente(u);
  const ths=E.colunas.map(c=>`<th>${esc(c)}</th>`).join('');
  const trs=E.linhas.map((l,i)=>{
    const vig=i===idx;
    const tds=E.colunas.map(c=>{ let v=l.celulas[c]||'';
      const meu = v && u && nomeNaCelula(v,u);
      return `<td>${esc(v)}${meu&&vig?'<span class="me-tag">VOCÊ</span>':''}</td>`; }).join('');
    return `<tr class="${vig?'vigente':''}">${tds}</tr>`;
  }).join('');
  return `<div class="page"><div class="page-ttl">\uD83D\uDCCB Escala do Ministério</div>
    ${naEscala?`<div class="card" style="border-left:4px solid var(--dourado)"><h3>\uD83D\uDCCD Você está escalado(a) esta semana</h3><p style="font-size:14px;color:#556">${esc(naEscala)}</p></div>`:''}
    ${adm?`<button class="mini-btn" style="margin-bottom:14px" onclick="$('#inpEscala').click()">\uD83D\uDCC4 Reimportar escala (Excel)</button><input type="file" id="inpEscala" accept=".xlsx,.xls,.csv" class="hidden" onchange="importarEscala(this)">`:''}
    <p style="font-size:12px;color:#789;margin-bottom:10px">A linha vigente da semana aparece destacada. Atualiza toda segunda-feira às 00:01.</p>
    <div class="escala-wrap"><table class="escala"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>`;
};
function importarEscala(inp){ const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    if(!rows.length) return toast('Planilha vazia.');
    const colunas=rows[0].map((c,i)=>String(c||('Col'+(i+1))).trim());
    const linhas=[]; for(let i=1;i<rows.length;i++){ const row=rows[i]; if(row.every(c=>!String(c).trim())) continue;
      const cel={}; colunas.forEach((c,j)=>cel[c]=String(row[j]||'').trim());
      const per=detectaPeriodo(colunas,cel);
      linhas.push({periodoInicio:per.ini,periodoFim:per.fim,celulas:cel}); }
    DB.escala={colunas,linhas}; saveDB();
    notificarImportacaoEscala();
    toast('Escala importada! '+linhas.length+' linha(s).'); go('escala');
  }catch(err){ toast('Erro ao ler o arquivo: '+err.message); } };
  r.readAsArrayBuffer(f);
}
function detectaPeriodo(colunas,cel){ // tenta achar datas dd/mm na primeira coluna
  const ano=new Date().getFullYear();
  for(const c of colunas){ const v=cel[c]||''; const m=v.match(/(\d{1,2})\/(\d{1,2})/g);
    if(m&&m.length){ const p=(s)=>{const[d,mo]=s.split('/');return new Date(ano,mo-1,d).toISOString();};
      return {ini:p(m[0]),fim:m[1]?p(m[1]):p(m[0])}; } }
  return {ini:'',fim:''};
}
/* ===== Fluxo de notificação da escala =====
   Limitação conhecida: por ser app estático, o disparo "segunda 00:01" ocorre
   quando o usuário ABRE o app numa nova semana. O push automático de verdade
   (mesmo com o app fechado) será ligado na finalização, via backend + Web Push. */

/* Chave de deduplicação por usuário + semana (evita avisar 2x na mesma semana) */
function chaveEscala(email,seg){ return 'ibnm_esc_'+email+'_'+seg; }
/* Notifica UM usuário sobre a escala vigente, no máximo 1x por semana (salvo force) */
function notificarEscalaUsuario(u,info,seg,force){
  const ch=chaveEscala(u.email,seg);
  if(force) localStorage.removeItem(ch);
  if(localStorage.getItem(ch)) return false;
  notificar(u.email,'\uD83D\uDCCD','Você está na escala desta semana',
    'Posto(s): '+info+'. Confira a Escala Semanal e se prepare!');
  localStorage.setItem(ch,'1'); return true;
}
/* Notifica todos os escalados da semana vigente (deduplicado; force reenviar) */
function notificaEscalados(force){
  const seg=segundaDaSemana(new Date()).toISOString().slice(0,10); let n=0;
  DB.usuarios.forEach(u=>{ const info=usuarioNaEscalaVigente(u);
    if(info && notificarEscalaUsuario(u,info,seg,force)) n++; });
  saveDB(); return n;
}
/* Chamado ao importar/reimportar a escala (ADM) */
function notificarImportacaoEscala(){
  notificarTodos('\uD83D\uDCCB','Escala atualizada','A escala do Ministério foi publicada/atualizada no app. Confira a Escala Semanal.');
  const n=notificaEscalados(false);
  if(n) toast(n+' escalado(s) desta semana foram avisados.');
}
/* Chamado ao abrir o app: simula o "vira na segunda" avisando quem entrou na semana vigente */
function verificaEscalaSemanal(){
  if(!DB.escala.linhas.length) return;
  const u=usuarioAtual(); if(!u) return;
  const info=usuarioNaEscalaVigente(u); if(!info) return;
  const seg=segundaDaSemana(new Date()).toISOString().slice(0,10);
  if(notificarEscalaUsuario(u,info,seg,false)){ saveDB(); atualizaBadge(); }
}
</script>

async function chkSupabase(){
  try{
    const t0=Date.now();
    const {error}=await sb.from('musicas').select('id',{count:'exact',head:true});
    const ms=Date.now()-t0;
    if(error){
      const m=String(error.message||error);
      const quota=/quota|exceeded|402|429|restricted|limit/i.test(m);
      return {estado:'erro', det:m, sol: quota
        ? ['Abra o Supabase → Billing/Usage e libere a cota da organização',
           'Sem cota, o projeto pode ficar restrito e o app para de sincronizar',
           'Enquanto isso, o que já está no aparelho continua funcionando']
        : ['Confira a internet do aparelho',
           'Veja o Supabase → Logs para o erro exato',
           'Se a chave do app mudou, atualize o index.html']};
    }
    if(ms>2500) return {estado:'atencao', det:'Respondendo, mas lento ('+ms+' ms)', sol:['Teste de novo em alguns minutos','Rede instável — tente Wi-Fi']};
    return {estado:'ok', det:'Respondendo ('+ms+' ms)'};
  }catch(err){ return {estado:'erro', det:String((err&&err.message)||err), sol:['Sem resposta do Supabase','Confira a internet e tente de novo']}; }
}
function chkDrive(){
  let cid=''; try{ cid=driveClientId(); }catch(_){}
  if(!cid) return {estado:'erro', det:'Client ID do Google não configurado', sol:['Painel do ADM → 📁 Google Drive → cole o Client ID','Use o mesmo Client ID do login com Google']};
  let con=false; try{ con=!!(window.__drive&&window.__drive.conectado&&window.__drive.conectado()); }catch(_){}
  if(con) return {estado:'ok', det:'Configurado e conectado neste aparelho'};
  return {estado:'atencao', det:'Configurado, mas este aparelho ainda não está autorizado', sol:['Abra um envio ao Drive (ou toque em Conectar) para autorizar','Se pedir de novo, a autorização expirou — reconecte']};
}
async function chkGithub(){
  try{
    const r=await fetch('https://api.github.com/repos/adaiascearataiana-gif/mmibnmapp',{headers:{Accept:'application/vnd.github+json'}});
    if(r.status===200){
      const j=await r.json();
      const ult=j.pushed_at? fmtDataHora(j.pushed_at):'';
      return {estado:'ok', det:'Repositório acessível'+(ult? ' · última atualização '+ult:'')};
    }
    if(r.status===403||r.status===429) return {estado:'atencao', det:'GitHub respondeu com limite de requisições (rate limit)', sol:['Aguarde ~1 min e toque em "Verificar de novo"','Só afesta esta verificação — não afeta o app']};
    if(r.status===404) return {estado:'erro', det:'Repositório não encontrado (404)', sol:['Confira se adaiascearataiana-gif/mmibnmapp está público','Se o repositório mudou de nome, avise para atualizar este painel']};
    return {estado:'erro', det:'GitHub respondeu HTTP '+r.status, sol:['Tente de novo em instantes','Veja se o GitHub está fora do ar: githubstatus.com']};
  }catch(err){ return {estado:'erro', det:'Sem resposta (offline ou rede bloqueada)', sol:['Confira a internet do aparelho','Algumas redes bloqueiam api.github.com — tente outra rede']}; }
}
async function conectVerifica(forcar){

/* ============== AVISO SEMANAL: CADASTRO INCOMPLETO (segunda-feira) ============== */
function cadastroFaltando(u){
  const f=[];
  if(!u) return ['dados básicos'];
  if(!String(u.nome||'').trim()) f.push('nome completo');
  if(!String(u.nasc||'').trim()) f.push('data de nascimento');
  if(String(u.tel||'').replace(/\D/g,'').length<10) f.push('telefone');
  if(!(u.vocal&&u.vocal.length) && !(u.instr&&u.instr.length)) f.push('função no Ministério (voz/instrumento)');
  return f; /* foto NÃO é obrigatória */
}
function _segundaISO(d){ d=d||new Date(); const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); const p=n=>String(n).padStart(2,'0'); return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); }
async function avisoCadastroIncompleto(){
  try{
    const hoje=new Date();
    if(hoje.getDay()!==1) return;                 /* somente segunda-feira */
    const seg=_segundaISO(hoje);
    const mk='avisoCad_'+seg;
    if(localStorage.getItem(mk)) return;          /* já enviado deste aparelho nesta semana */
    if(typeof sb==='undefined'||!sb) return;
    const {data:ps,error}=await sb.from('perfis').select('email,nome,nasc,tel,vocal,instr,admin');
    if(error||!ps) return;
    const alvos=ps.map(p=>({p,f:cadastroFaltando(p)})).filter(x=>x.f.length && x.p.email);
    if(!alvos.length){ localStorage.setItem(mk,'1'); return; }  /* tudo completo: não envia mais */
    const souAdm=!!ehAdmin();
    let rpcOk=true;
    for(const {p,f} of alvos){
      const email=String(p.email).toLowerCase();
      const corpo='Falta(m) no seu cadastro: '+f.join(', ')+'. Abra o Perfil e complete — quando estiver tudo certo, este aviso para sozinho.';
      if(rpcOk){
        try{
          const {error:e1}=await sb.rpc('enviar_aviso',{p_chave:'cadseg_'+seg+'_'+email, p_emails:[email], p_ic:'📝', p_titulo:'Complete seu cadastro', p_corpo:corpo, p_link:'go:perfil', p_popup:false});
          if(!e1) continue;
          if(/enviar_aviso|function|not found|42883|PGRST202/i.test(String(e1.message||e1))) rpcOk=false;
        }catch(_){ rpcOk=false; }
      }
      /* sem rpc: ADM avisa todos; membro incompleto avisa só a si mesmo (evita spam cruzado) */
      if(!souAdm && email!==_sessaoEmail) continue;
      try{
        await sb.from('notificacoes').insert({destino_email:email, ic:'📝', titulo:'Complete seu cadastro', corpo, data:new Date().toISOString(), lida:false, link:'go:perfil', popup:false});
      }catch(_){}
    }
    localStorage.setItem(mk,'1');
  }catch(_){}
}
function toggleAdmin(email){ const u=DB.usuarios.find(x=>x.email===email); if(!u) return;
  u.admin=!u.admin; saveDB(); toast(u.admin?'Agora é ADM.':'ADM removido.'); go('admin'); }
</script>

async function addAudio(id){ const m=DB.musicas.find(x=>x.id===id); const nome=$('#edAudNome').value.trim(); let v=$('#edAudUrl').value.trim();

async function importarEscala(inp){ const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=async e=>{ try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    if(!rows.length) return toast('Planilha vazia.');
    const colunas=rows[0].map((c,i)=>String(c||('Col'+(i+1))).trim());
    const linhas=[]; for(let i=1;i<rows.length;i++){ const row=rows[i]; if(row.every(c=>!String(c).trim())) continue;
      const cel={}; colunas.forEach((c,j)=>cel[c]=String(row[j]||'').trim());
      const per=detectaPeriodo(colunas,cel); linhas.push({periodoInicio:per.ini,periodoFim:per.fim,celulas:cel}); }
    DB.escala={colunas,linhas};
    await sb.from('escala').update({colunas,linhas,updated_at:new Date().toISOString()}).eq('id',1);
    notificarImportacaoEscala();
    toast('Escala importada! '+linhas.length+' linha(s).'); go('escala');
  }catch(err){ toast('Erro ao ler o arquivo: '+err.message); } };
  r.readAsArrayBuffer(f);
}

/* ---------- UPLOAD DIRETO AO GOOGLE DRIVE (GIS) ---------- */
function carregarGIS(){
  if(window.google&&window.google.accounts&&window.google.accounts.oauth2) return Promise.resolve();
  if(window._gisLoading) return window._gisLoading;
  window._gisLoading=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Falha ao carregar o Google.'));
    document.head.appendChild(s);
  });
  return window._gisLoading;
}
async function ensureDriveToken(){
  const cid=driveClientId();
  if(!cid) throw new Error('Configure o Client ID do Google no Painel do ADM.');
  await carregarGIS();
  if(_gisTok && Date.now()<_gisExp-60000) return _gisTok;
  return new Promise((resolve,reject)=>{
    try{
      const tc=google.accounts.oauth2.initTokenClient({
        client_id:cid, scope:'https://www.googleapis.com/auth/drive.file',
        callback:(resp)=>{ if(resp&&resp.access_token){ _gisTok=resp.access_token; _gisExp=Date.now()+((resp.expires_in||3600)*1000); resolve(_gisTok); } else reject(new Error('Autorizacao negada.')); }
      });
      tc.requestAccessToken({prompt:_gisTok?'':'consent'});
    }catch(e){ reject(e); }
  });
}
async function uploadParaDrive(file,nome){
  const token=await ensureDriveToken();
  const meta={name:nome||file.name};
  const fd=new FormData();
  fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  fd.append('file',file);
  const up=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
  if(!up.ok) throw new Error('Upload falhou ('+up.status+').');
  const j=await up.json(); const fid=j.id;
  try{ await fetch('https://www.googleapis.com/drive/v3/files/'+fid+'/permissions',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})}); }catch(e){}
  return fid;
}
async function driveUploadAudio(id,inp){
  const f=inp.files[0]; if(!f){ return; }
  const nome=(($('#edAudNome')&&$('#edAudNome').value)||'').trim()||f.name.replace(/\.[^.]+$/,'');
  toast('Enviando ao Google Drive...');
  try{
    const fid=await uploadParaDrive(f,nome); const url=driveUrl(fid);
    const m=DB.musicas.find(x=>x.id===id); m.audios=m.audios||[]; m.audios.push({nome,url});
    try{ await sb.from('musicas').update({audios:m.audios}).eq('id',id); }catch(e){}
    toast('Audio enviado ao Drive! \uD83C\uDF89'); editorCifra(id);
  }catch(e){ toast('Erro no upload: '+(e.message||e)); }
  inp.value='';
}
function cardDriveCfg(){
  const cid=driveClientId();
  return `<div class="card"><h3>\uD83D\uDCC1 Google Drive (upload direto)</h3>
    <p style="font-size:12.5px;color:#556;margin-bottom:8px">Cole o <b>Client ID OAuth</b> do Google Cloud para enviar audios direto do app para o Drive. Funciona apenas no site publicado (HTTPS) com a origem autorizada no Google Cloud.</p>
    <div class="field"><label>Client ID OAuth</label><input id="cfgGcid" value="${esc(cid)}" placeholder="xxxx.apps.googleusercontent.com"></div>
    <button class="mini-btn" onclick="salvarDriveCfg()">\uD83D\uDCBE Salvar Client ID</button>
    ${cid?'<p style="font-size:11.5px;color:var(--verde-claro);margin-top:8px">\u2705 Client ID configurado.</p>':''}</div>`;
}
async function salvarDriveCfg(){
  const v=(($('#cfgGcid')&&$('#cfgGcid').value)||'').trim();
  localStorage.setItem('ibnm_gcid',v);
  await salvarConfig('google_drive',{client_id:v});
  _gisTok=null; _gisExp=0; toast('Client ID salvo!'); go('admin');
}
/* ---------- PWA + NOTIFICACOES ---------- */
function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol!=='https:' && location.hostname!=='localhost') return;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function pedirPermissaoNotif(){
  if(!('Notification' in window)) return toast('Seu aparelho não suporta notificações.');
  Notification.requestPermission().then(p=>{ toast(p==='granted'?'Notificações ativadas! \uD83D\uDD14':'Permissao negada.'); if($('#appShell')&&!$('#appShell').classList.contains('hidden')) go('perfil'); });
}
function notifSistema(titulo,corpo){
  try{ if(('Notification' in window)&&Notification.permission==='granted'){ new Notification(titulo||'IBNM Musica',{body:corpo||'',icon:'icon-192.png',badge:'icon-192.png'}); } }catch(e){}
}

const _lrPrev=ligarRealtime;
ligarRealtime=function(){ _lrPrev();
  try{ const ch=sb.channel('ibnm-rt2'); ['config','presencas','ao_vivo'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>agendarReload())); ch.subscribe(); }catch(e){}
};

const _arPrev=agendarReload;
agendarReload=function(){ _arPrev(); clearTimeout(window._rt2t); window._rt2t=setTimeout(()=>{ try{ atualizaBannerVivo(); aplicarAoVivo(false); }catch(e){} },520); };

const _iniPrev=iniciarApp;
iniciarApp=function(){ _iniPrev(); try{ registrarSW(); atualizaBannerVivo(); aplicarAoVivo(true); }catch(e){} };

const _badgePrev=atualizaBadge;

  const u=usuarioAtual(); if(!u){ _lastUnread=-1; return; }
  const list=(DB.notificacoes[u.email]||[]).filter(n=>!n.lida); const n=list.length;
  if(_lastUnread>=0 && n>_lastUnread){ const top=list[0]; if(top) notifSistema(top.titulo,top.corpo); }
  _lastUnread=n;
};

const _escPrev=ROTAS.escala;
ROTAS.escala=function(){ let html=_escPrev(); const u=usuarioAtual();
  if(u && usuarioNaEscalaVigente(u)) html=html.replace('<div class="escala-wrap">', cardPresenca(minhaPresenca())+'<div class="escala-wrap">');

};

const _admPrev=ROTAS.admin;
ROTAS.admin=function(){ let html=_admPrev(); if(!ehAdmin()) return html;

  if(html.indexOf('<div class="card"><h3>Membros')>=0) html=html.replace('<div class="card"><h3>Membros', extra+'<div class="card"><h3>Membros');
  else html=html.replace('</div></div>', extra+'</div></div>');
  return html;
};

const _perfPrev=ROTAS.perfil;
ROTAS.perfil=function(){ let html=_perfPrev();
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  const btn = perm==='granted' ? '<p style="font-size:12.5px;color:var(--verde-claro)">\uD83D\uDD14 Notificações ativadas neste aparelho.</p>'
    : perm==='unsupported' ? '<p style="font-size:12.5px;color:#9aa">Notificações não suportadas neste navegador.</p>'
    : '<button class="mini-btn" onclick="pedirPermissaoNotif()">\uD83D\uDD14 Ativar notificações neste aparelho</button>';

  const i=html.lastIndexOf('</div>'); return i>=0 ? (html.slice(0,i)+card+html.slice(i)) : (html+card);
};

const _abrirPrevV2=abrirMusica;
abrirMusica=function(id,aba){ _abrirPrevV2(id,aba); _viewAtual=function(){ abrirMusica(id,aba); };
  if(!ehAdmin()) return;
  const c=document.getElementById('content'); if(!c) return;
  const page=c.querySelector('.page')||c;
  const liveHere=AO_VIVO.ativo&&AO_VIVO.musica_id===id;
  const bar=document.createElement('div'); bar.className='card'; bar.style.cssText='border-left:4px solid #c0392b;margin-top:4px';

    ? '<button class="mini-btn" onclick="iniciarAoVivo(\''+id+'\',\''+(aba||'cifra')+'\')">\u25B6 Iniciar ao vivo</button>'
    : (liveHere ? '<button class="mini-btn sec" onclick="encerrarAoVivo()">\u23F9 Encerrar</button>'
                : '<button class="mini-btn" onclick="trocarAoVivo(\''+id+'\',\''+(aba||'cifra')+'\')">\uD83D\uDD04 Trazer p/ esta</button> <button class="mini-btn sec" onclick="encerrarAoVivo()">\u23F9 Encerrar</button>');

  page.appendChild(bar);
};

const _edPrevV2=editorCifra;
editorCifra=function(id){ _edPrevV2(id);

  let addBtn=null; c.querySelectorAll('button').forEach(b=>{ const oc=b.getAttribute('onclick')||''; if(oc.indexOf("addAudio('"+id)>=0) addBtn=b; });
  if(!addBtn) return;
  const cid=driveClientId(); const wrap=document.createElement('div'); wrap.style.marginTop='10px';
  wrap.innerHTML = cid
    ? '<button class="mini-btn" onclick="document.getElementById(\'edDriveFile\').click()">\u2601\uFE0F Enviar arquivo ao Drive</button>'+
      '<input type="file" id="edDriveFile" accept="audio/*" class="hidden" onchange="driveUploadAudio(\''+id+'\',this)">'+
      '<p style="font-size:11.5px;color:#9aa;margin-top:6px">Envia direto ao Google Drive e já adiciona o link.</p>'
    : '<p style="font-size:11.5px;color:#c0392b;margin-top:6px">Para enviar arquivos direto ao Drive, configure o Client ID no Painel do ADM.</p>';
  addBtn.parentNode.insertBefore(wrap, addBtn.nextSibling);
};

/* ===== Melhorias IBNM: cantadas, zoom, fonte do app ===== */
/* ---- Músicas que já cantamos ---- */
var fcBusca='', fcDia='TODOS', fcEvento='TODOS', fcStats=false;
function acharCifraApp(titulo){ const n=norm(titulo); const hit=DB.musicas.find(x=>norm(x.titulo)===n && x.cifra); return hit? hit.id : null; }
/* ---- abrir música a partir do nome (Músicas ou Cantor Cristão) ---- */
function nomeLimpo(s){ return norm(s).replace(/[^a-z0-9]+/g,' ').replace(/(^|\s)\d+(\s|$)/g,' ').replace(/\s+/g,' ').trim(); }
function acharMusicaApp(titulo){ // qualquer música do app; prefere a que tem cifra/letra
  const n=norm(titulo), nl=nomeLimpo(titulo); if(!n && !nl) return null;
  const bate=x=>{ const t=norm(x.titulo), tl=nomeLimpo(x.titulo); return t===n || (nl&&(t===nl||tl===nl||tl===n)); };
  const todas=(DB.musicas||[]).filter(bate);
  if(!todas.length) return null;
  const melhor=todas.find(x=>x.cifra)||todas.find(x=>x.letra)||todas[0];
  return melhor.id;
}
function acharHinoApp(titulo){ // hino do Cantor Cristão (por título ou número citado no nome)
  if(typeof window.HINOS==='undefined'||!window.HINOS) return null;
  const nl=nomeLimpo(titulo); if(!nl) return null;
  const porTitulo=window.HINOS.find(h=>nomeLimpo(h.titulo)===nl);
  if(porTitulo) return porTitulo.n;
  const nums=(String(titulo).match(/\d+/g)||[]).map(Number).filter(x=>x>=1&&x<=581);
  for(const num of nums){
    const h=window.HINOS.find(x=>x.n===num);
    if(h){ const ht=nomeLimpo(h.titulo);
      if(ht===nl||(ht.length>6 && (ht.includes(nl)||nl.includes(ht)))) return h.n; }
  }
  return null;
}
/* cria a música no app (Músicas) para o ADM preencher cifra e letra */
async function garantirMusicaApp(nome, artista){
  const id=acharMusicaApp(nome);
  if(id) return id;
  if(!ehAdmin()) return null;
  const titulo=String(nome||'').trim(); if(!titulo) return null;
  const idn=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():uid();
  const art=String(artista||'').trim();
  try{
    if(typeof sb!=='undefined'&&sb){
      const {error}=await sb.from('musicas').insert({id:idn,titulo,artista:art,cifra:'',letra:'',youtube:'',audios:[],dados:{publicada:false},created_by:(typeof _sessaoId!=='undefined'?_sessaoId:null)});
      if(error){ toast('Erro: '+error.message); return null; }
    }
  }catch(e){ return null; }
  DB.musicas.push({id:idn,titulo,artista:art,cifra:'',letra:'',youtube:'',audios:[],publicada:false});
  return idn;
}
/* fluxo do toque: ADM abre o card para preencher; usuário visualiza */
async function abrirPorTitulo(nome, artista){
  const id=acharMusicaApp(nome);
  if(id){
    const m=DB.musicas.find(x=>x.id===id);
    const vazio=m && !m.cifra && !m.letra;
    if(ehAdmin() && vazio){ editorCifra(id); toast('Card aberto: coloque a cifra e a letra e publique.'); return; }
    abrirMusica(id,'cifra'); return;
  }
  const hn=acharHinoApp(nome);
  if(hn){ if(typeof cantorAbrir==='function') cantorAbrir(hn); else go('cantor'); return; }
  if(ehAdmin()){
    const novo=await garantirMusicaApp(nome, artista);
    if(novo){ toast('Música criada! Coloque a cifra e a letra e publique.'); editorCifra(novo); return; }
    return;
  }
  toast('Esta música ainda não tem cifra/letra — o ADM ainda não cadastrou.');
}
function buscarCantadas(v){ fcBusca=v; const c=document.getElementById('fcLista'); if(c) c.innerHTML=listaCantadasHTML(); }
function filtroCantadasDia(sel){ fcDia=sel.value; const c=document.getElementById('fcLista'); if(c) c.innerHTML=listaCantadasHTML(); }
function filtroCantadasEvento(sel){ fcEvento=sel.value; const c=document.getElementById('fcLista'); if(c) c.innerHTML=listaCantadasHTML(); }
function _contarCantadas(){
  const mapa={};
  MUSICAS_CANTADAS.forEach(m=>{ const nome=(m.m||'').trim(); if(!nome) return; const k=norm(nome); if(!mapa[k]) mapa[k]={nome:nome,n:0,a:(m.a||'')}; mapa[k].n++; });
  return Object.values(mapa).sort((a,b)=> b.n-a.n || a.nome.localeCompare(b.nome));
}
function _parseDataBR(s){
  if(!s) return null;
  const partes=(''+s).replace(/\n/g,' ').match(/(\d{2})\/(\d{2})\/(\d{4})/g);
  if(!partes||!partes.length) return null;
  const ult=partes[partes.length-1].split('/').map(Number);
  return new Date(ult[2], ult[1]-1, ult[0]);
}
function _fmtDataBR(dt){ const p=n=>(''+n).padStart(2,'0'); return p(dt.getDate())+'/'+p(dt.getMonth()+1)+'/'+dt.getFullYear(); }
function _tempoDecorrido(dt){
  const dias=Math.floor((Date.now()-dt.getTime())/86400000);
  if(dias<0) return 'ainda será cantada';
  if(dias===0) return 'hoje';
  if(dias<30) return 'há '+dias+' dia'+(dias>1?'s':'');
  const meses=Math.floor(dias/30);
  if(meses<12) return 'há '+meses+(meses>1?' meses':' mês');
  const anos=Math.floor(dias/365);
  return 'há '+anos+(anos>1?' anos':' ano');
}
function _naoCantadasHaTempo(){
  const mapa={};
  MUSICAS_CANTADAS.forEach(m=>{ const nome=(m.m||'').trim(); if(!nome) return; const k=norm(nome); const dt=_parseDataBR(m.d); if(!mapa[k]) mapa[k]={nome:nome,ult:dt,a:(m.a||'')}; else if(dt && (!mapa[k].ult || dt>mapa[k].ult)) mapa[k].ult=dt; });
  const arr=Object.values(mapa).filter(x=>x.ult);
  arr.sort((a,b)=> a.ult-b.ult);
  return arr;
}
function estatisticasCantadasHTML(){
  const arr=_contarCantadas();
  if(!arr.length) return '<p style="font-size:13px;color:#789">Sem dados ainda.</p>';
  const mais=arr.slice(0,10);
  const menos=arr.slice().reverse().slice(0,10);
  const max=mais.length?mais[0].n:1;
  const cores=['#f1c40f','#e67e22','#e74c3c','#e84393','#9b59b6','#3498db','#1abc9c','#16a085','#27ae60','#2ecc71'];
  const bar=(x,i)=>`<div class="st-bar-row" style="cursor:pointer" data-n="${esc(x.nome)}" data-a="${esc(x.a||'')}" onclick="abrirPorTitulo(this.dataset.n,this.dataset.a)"><span class="st-bar-nome" title="${esc(x.nome)}">${i+1}. ${esc(x.nome)}</span><span class="st-bar-track"><span class="st-bar-fill" style="width:${Math.max(4,Math.round(x.n/max*100))}%;background:${cores[i]||'var(--verde-med)'}"></span></span><span class="st-bar-val">${x.n}</span></div>`;
  const li=(x,i)=>`<div class="st-row" style="cursor:pointer" data-n="${esc(x.nome)}" data-a="${esc(x.a||'')}" onclick="abrirPorTitulo(this.dataset.n,this.dataset.a)"><span class="st-pos">${i+1}</span><span class="st-nome">${esc(x.nome)}</span><span class="st-n">${x.n}x</span></div>`;
  const antigas=_naoCantadasHaTempo().slice(0,15);
  const liA=(x,i)=>`<div class="st-row" style="cursor:pointer" data-n="${esc(x.nome)}" data-a="${esc(x.a||'')}" onclick="abrirPorTitulo(this.dataset.n,this.dataset.a)"><span class="st-pos">${i+1}</span><span class="st-nome">${esc(x.nome)}</span><span class="st-when">${_fmtDataBR(x.ult)}<br><small>${_tempoDecorrido(x.ult)}</small></span></div>`;
  const colAntigas=`<div class="st-col"><div class="st-ttl">\u23F3 Sem cantar há mais tempo</div>${antigas.length? antigas.map(liA).join('') : '<p style=\"font-size:13px;color:#789\">Sem dados de data.</p>'}</div>`;
  const _cultos=new Set(MUSICAS_CANTADAS.map(m=>(m.d||'')+'|'+(m.e||''))).size;
  const _media=_cultos? Math.round(MUSICAS_CANTADAS.length/_cultos*10)/10 : 0;
  const resumo=`<div class="st-sum"><div class="st-sum-c"><div class="st-sum-n">${MUSICAS_CANTADAS.length}</div><div class="st-sum-l">Músicas cantadas (total)</div></div><div class="st-sum-c"><div class="st-sum-n">${arr.length}</div><div class="st-sum-l">Músicas diferentes</div></div><div class="st-sum-c"><div class="st-sum-n">${_cultos}</div><div class="st-sum-l">Cultos diferentes</div></div><div class="st-sum-c"><div class="st-sum-n">${_media}</div><div class="st-sum-l">Média de músicas por culto</div></div></div>`;
  return `${resumo}<div class="st-box">
    <div class="st-col"><div class="st-ttl">\uD83D\uDCCA Top 10 músicas mais cantadas</div><div class="st-chart">${mais.map(bar).join('')}</div></div>
    <div class="st-col"><div class="st-ttl">\uD83C\uDF31 Menos cantadas</div>${menos.map(li).join('')}</div>
    ${colAntigas}
  </div>`;
}
function toggleStatsCantadas(){
  fcStats=!fcStats;
  const c=document.getElementById('fcStats'); const b=document.getElementById('fcStatsBtn');
  if(c){ c.style.display=fcStats?'block':'none'; c.innerHTML=fcStats?estatisticasCantadasHTML():''; }
  if(b){ b.innerHTML=fcStats?'\uD83D\uDCCA Ocultar estatísticas':'\uD83D\uDCCA Ver estatísticas'; }
}
function listaCantadasHTML(){
  const q=norm(fcBusca);
  let arr=MUSICAS_CANTADAS.filter(m=>{
    if(fcDia!=='TODOS' && m.di!==fcDia) return false;
    if(fcEvento!=='TODOS' && (m.e||'')!==fcEvento) return false;
    if(q){ return norm(m.m).includes(q)||norm(m.a).includes(q)||norm(m.e).includes(q)||norm((m.d||'').replace(/\n/g,' ')).includes(q); }
    return true;
  });
  if(!arr.length) return '<div class="empty"><div class="big">\uD83C\uDFB6</div>Nenhuma música encontrada.</div>';
  return arr.map(m=>{
    const idMus=acharMusicaApp(m.m)||acharCifraApp(m.m);
    const hinoN=acharHinoApp(m.m);
    const mm2=idMus?DB.musicas.find(x=>x.id===idMus):null;
    const yt = m.w? `<a class="fc-yt" href="${esc(m.w)}" target="_blank" onclick="event.stopPropagation()">\u25B6 YouTube</a>`:'';
    const abrir = `data-n="${esc(m.m)}" data-a="${esc(m.a||'')}" onclick="abrirPorTitulo(this.dataset.n,this.dataset.a)" style="cursor:pointer"`;
    const badge = (mm2&&mm2.cifra)?'<span class="fc-badge">cifra \u2713</span>':(hinoN?'<span class="fc-badge">\uD83D\uDCD6 hino</span>':(mm2?'<span class="fc-badge">sem cifra</span>':''));
    return `<div class="fc-item" ${abrir}>
      <div class="fc-main"><div class="fc-t">${esc(m.m)}</div>
        <div class="fc-a">${esc(m.a||'\u2014')}${m.t?' \u00b7 Tom '+esc(m.t):''}</div>
        <div class="fc-meta">${esc((m.d||'').replace(/\n/g,' '))}${m.e?' \u00b7 '+esc(m.e):''}</div></div>
      <div class="fc-side">${badge}${yt}</div></div>`;
  }).join('');
}

/* ---- Zoom (pinch no celular / Ctrl+scroll no PC) ---- */
var _zoomScale=1;
function _zoomTargetEl(){ return document.getElementById('zoomTarget'); }
function _applyZoom(){ const el=_zoomTargetEl(); if(!el) return; const base=parseFloat(el.dataset.base||'14'); el.style.fontSize=(Math.round(base*_zoomScale*10)/10)+'px'; }
function _clampZoom(){ if(_zoomScale<0.7)_zoomScale=0.7; if(_zoomScale>2.8)_zoomScale=2.8; }
function zoomView(dir){ if(dir===0){ _zoomScale=1; } else { _zoomScale += dir*0.12; } _clampZoom(); _applyZoom(); }
function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
function bindZoomView(){
  const el=_zoomTargetEl(); if(!el) return; _zoomScale=1; _applyZoom();
  let startDist=0, startScale=1;
  el.addEventListener('touchstart',function(e){ if(e.touches.length===2){ startDist=dist(e.touches); startScale=_zoomScale; } },{passive:true});
  el.addEventListener('touchmove',function(e){ if(e.touches.length===2 && startDist){ e.preventDefault(); const r=dist(e.touches)/startDist; _zoomScale=startScale*r; _clampZoom(); _applyZoom(); } },{passive:false});
  el.addEventListener('touchend',function(e){ if(e.touches.length<2) startDist=0; });
  el.addEventListener('wheel',function(e){ if(e.ctrlKey){ e.preventDefault(); _zoomScale += (e.deltaY<0?0.08:-0.08); _clampZoom(); _applyZoom(); } },{passive:false});
}

/* ---- Tamanho da fonte do app (persistente, sem estourar a tela) ---- */
function appFontScale(){ let v=parseInt(localStorage.getItem('ibnm_fscale')||'100',10); if(isNaN(v)||v<100) v=100; if(v>150) v=150; return v; }
function aplicaAppFont(){
  const sc=appFontScale()/100;
  let st=document.getElementById('appFontStyle');
  if(!st){ st=document.createElement('style'); st.id='appFontStyle'; document.head.appendChild(st); }
  if(sc===1){ st.textContent=''; return; }
  const r=(px)=>Math.round(px*sc*10)/10;
  st.textContent='.page{font-size:'+r(15)+'px}'+
    '.card p,.info-row .k,.info-row .v,.fc-t,.song-head .a{font-size:'+r(14)+'px}'+
    '.fc-a,.fc-meta{font-size:'+r(13)+'px}'+
    '.letra-box{font-size:'+r(16)+'px}'+
    '.cifra-box{font-size:'+r(14)+'px}'+
    '.song-head .t{font-size:'+r(20)+'px}'+
    '.page-ttl{font-size:'+r(19)+'px}'+
    '.sub-links button,.mini-btn{font-size:'+r(13)+'px}';
}
function setAppFont(v){ v=parseInt(v,10); if(isNaN(v))v=100; if(v<100)v=100; if(v>150)v=150; localStorage.setItem('ibnm_fscale',v);
  const val=document.getElementById('fsVal'); if(val) val.textContent=v+'%';
  const prev=document.getElementById('fsPrev'); if(prev) prev.style.fontSize=(16*v/100)+'px';
  aplicaAppFont();
}

/* ---- Wrappers: reaplicar fonte e ativar zoom em cada navegação ---- */
if(typeof go==='function'){ const _go_orig=go; go=function(page,arg){ _go_orig(page,arg); aplicaAppFont(); }; }
if(typeof abrirMusica==='function'){ const _am_orig=abrirMusica; abrirMusica=function(id,aba){ _am_orig(id,aba); aplicaAppFont(); setTimeout(bindZoomView,0); }; }
try{ aplicaAppFont(); }catch(e){}
</script>

<script>
/* === BACKUP DRIVE === */
/* ===== Backup das cifras/dados no MESMO Google Drive dos áudios ===== */
function montarBackupObj(){
  return {
    tipo:'backup-ibnm',
    versao:(typeof VERSION!=='undefined'?VERSION:''),
    gerado:new Date().toISOString(),
    musicas:(DB.musicas||[]).map(m=>({id:m.id,titulo:m.titulo,artista:m.artista,cifra:m.cifra,letra:m.letra,youtube:m.youtube,audios:m.audios||[]})),
    escala:DB.escala||null
  };
}
function _nomeBackup(){ return 'backup-ibnm-'+new Date().toISOString().slice(0,10)+'.json'; }
function baixarBackupLocal(){
  const obj=montarBackupObj();
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=_nomeBackup(); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup baixado no aparelho.');
}
async function backupParaDrive(){
  try{
    if(typeof driveClientId!=='function' || !driveClientId()){ toast('Configure o Client ID do Google no card acima primeiro.'); return; }
    toast('Enviando backup ao Google Drive...');
    const obj=montarBackupObj();
    const nome=_nomeBackup();
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
    let file; try{ file=new File([blob],nome,{type:'application/json'}); }catch(e){ file=blob; }
    const fid=await uploadParaDrive(file,nome);
    localStorage.setItem('ibnm_bkp_ultimo',new Date().toISOString());
    toast('Backup salvo no Google Drive! \uD83C\uDF89');
    go('admin');
  }catch(e){ toast('Erro no backup: '+(e.message||e)); }
}
function restaurarBackup(inp){
  const f=inp.files[0]; if(!f){ return; } inp.value='';
  const r=new FileReader();
  r.onload=async function(e){
    try{
      const obj=JSON.parse(e.target.result);
      if(!obj || obj.tipo!=='backup-ibnm' || !Array.isArray(obj.musicas)) return toast('Arquivo de backup inválido.');
      if(!confirm('Restaurar '+obj.musicas.length+' música(s) do backup? As cifras/letras/áudios atuais serão substituídos pelos do backup; músicas que só existem no backup serão adicionadas.')) return;
      obj.musicas.forEach(bm=>{
        let m=DB.musicas.find(x=>x.id===bm.id) || DB.musicas.find(x=>norm(x.titulo)===norm(bm.titulo));
        if(m){ m.cifra=bm.cifra||''; m.letra=bm.letra||''; m.youtube=bm.youtube||''; if(bm.audios) m.audios=bm.audios; }
        else { DB.musicas.push({id:bm.id||(typeof uid==='function'?uid():String(Date.now())),titulo:bm.titulo||'',artista:bm.artista||'',cifra:bm.cifra||'',letra:bm.letra||'',youtube:bm.youtube||'',audios:bm.audios||[],publicada:true}); }
      });
      if(obj.escala && obj.escala.colunas) DB.escala=obj.escala;
      saveDB();
      try{ if(typeof sb!=='undefined' && sb){ for(const m of DB.musicas){ await sb.from('musicas').update({cifra:m.cifra,letra:m.letra,youtube:m.youtube,audios:m.audios}).eq('id',m.id); } } }catch(err){}
      toast('Backup restaurado! \u2705'); go('admin');
    }catch(err){ toast('Erro ao ler backup: '+(err.message||err)); }
  };
  r.readAsText(f);
}
function cardBackupDrive(){
  const ult=localStorage.getItem('ibnm_bkp_ultimo');
  const quando=ult? new Date(ult).toLocaleString('pt-BR') : 'nunca';
  return '<div class="card"><h3>\uD83D\uDCBE Backup no Google Drive</h3>'+
    '<p style="font-size:12.5px;color:#556;margin-bottom:8px">Salva todas as <b>cifras</b>, letras e links de áudio num arquivo <code>'+_nomeBackup()+'</code> no <b>mesmo Google Drive</b> usado para os áudios (mesmo Client ID do card acima).</p>'+
    '<button class="mini-btn" onclick="backupParaDrive()">\u2601\uFE0F Fazer backup no Drive agora</button>'+
    '<button class="mini-btn sec" style="margin-left:6px" onclick="baixarBackupLocal()">\u2B07\uFE0F Baixar no aparelho</button>'+
    '<div style="margin-top:10px"><label class="mini-btn sec" style="cursor:pointer;display:inline-block">\u267B\uFE0F Restaurar de um arquivo<input type="file" accept="application/json,.json" class="hidden" onchange="restaurarBackup(this)"></label></div>'+
    '<p style="font-size:11.5px;color:#9aa;margin-top:8px">\u00daltimo backup no Drive: '+quando+'</p></div>';
}
if(typeof ROTAS!=='undefined' && ROTAS.admin){ const _admBkpPrev=ROTAS.admin;
  ROTAS.admin=function(){ let html=_admBkpPrev(); if(!ehAdmin()) return html;
    const card=cardBackupDrive();
    const i=html.lastIndexOf('</div>'); return i>=0 ? (html.slice(0,i)+card+html.slice(i)) : (html+card);
  };
}
</script>

<script>
/* ===== Botão VOLTAR do Android / gesto de voltar do iPhone (v0.4.3) =====
   Ordem do que o VOLTAR fecha/volta:
   1) projetor, janelas (folhas, modais), menu lateral, boas-vindas
   2) tela anterior (músicas, hinos, editor, academia, escala...)
   3) quando acaba o histórico: volta para o INÍCIO
   4) no INÍCIO: pergunta se quer sair do app
   Nas telas de login: Cadastro/Recuperar senha voltam para o Login. */
(function(){
  if(window.__ibnmBack) return; window.__ibnmBack=true;
  var INICIO='go|inicio|';
  function _el(id){ return document.getElementById(id); }
  function _menuAberto(){ var s=_el('sidemenu'); return !!(s && s.classList.contains('show')); }
  function _modalAberto(){ var m=_el('modalBg'); return !!(m && m.classList.contains('show')); }
  function _bvAberto(){ var b=_el('bvScreen'); return !!(b && b.innerHTML.trim()!==''); }
  function _sheetAberto(){ return !!document.querySelector('.cc-sheet-bg'); }
  function _projAberto(){ return !!document.querySelector('.proj'); }
  function _avisoAberto(){ return !!document.querySelector('.av-bg'); }
  function _popAberto(){ return !!document.querySelector('.cor-pop.show'); }
  function _overlayAberto(){ return _avisoAberto()||_projAberto()||_sheetAberto()||_modalAberto()||_popAberto()||_menuAberto()||_bvAberto(); }
  function _fecharOverlay(){
    if(_avisoAberto()){ var av=document.querySelectorAll('.av-bg'); av[av.length-1].remove(); return; }
    if(_projAberto()){ if(window.fecharProjetor) window.fecharProjetor(); else document.querySelectorAll('.proj').forEach(function(b){ b.remove(); }); return; }
    if(_sheetAberto()){ var bs=document.querySelectorAll('.cc-sheet-bg'); bs[bs.length-1].remove(); return; }
    if(_modalAberto() && typeof fecharModal==='function'){ fecharModal(); return; }
    if(_popAberto()){ document.querySelectorAll('.cor-pop.show').forEach(function(p){ p.classList.remove('show'); }); return; }
    if(_menuAberto() && typeof toggleMenu==='function'){ toggleMenu(false); return; }
    if(_bvAberto() && typeof fecharBoasVindas==='function'){ fecharBoasVindas(); return; }
  }
  function _naAutenticacao(){ var a=_el('authScreens'); var sh=_el('appShell'); return !!(a && a.innerHTML.trim()!=='' && (!sh || sh.classList.contains('hidden'))); }
  function _telaSecundariaLogin(){ return !!(_el('cNome') || _el('recEmail')); }

  var navStack=[];
  function _topo(){ return navStack.length? navStack[navStack.length-1] : null; }
  function _mesmaTela(a,b){ if(!a||!b) return false; var x=a.split('|'), y=b.split('|'); return x[0]===y[0] && x[1]===y[1] && (x[0]!=='go' || (x[2]||'')===(y[2]||'')); }
  function _registra(screen){
    var top=_topo();
    if(top===screen) return;
    if(_mesmaTela(top,screen)){ navStack[navStack.length-1]=screen; return; }      /* mesma música em outra aba, mesmo hino */
    if(navStack.length>1 && navStack[navStack.length-2]===screen){ navStack.pop(); return; } /* botões "‹ Voltar" do app */
    if(screen===INICIO){ navStack=[INICIO]; return; }                                 /* Início é sempre a base */
    navStack.push(screen);
    if(navStack.length>60) navStack.splice(1,1);
  }
  window.__navReg=_registra;
  window.__navStack=function(){ return navStack.slice(); };
  if(typeof window.go==='function'){
    var _goOrig=window.go; window.__goOrig=_goOrig;
    window.go=function(page,arg){ _goOrig(page,arg); if(page!=='ajuda') _registra('go|'+page+'|'+(arg==null?'':arg)); };
  }
  if(typeof window.abrirMusica==='function'){
    var _amOrig=window.abrirMusica; window.__amOrig=_amOrig;
    window.abrirMusica=function(id,aba){ _amOrig(id,aba); _registra('mus|'+id+'|'+(aba||'cifra')); };
  }
  if(typeof window.editorCifra==='function'){
    var _edOrig=window.editorCifra; window.__edOrig=_edOrig;
    window.editorCifra=function(id){ _edOrig(id); _registra('ed|'+id); };
  }
  function _irPara(entry){
    try{ if(window.__pararRolagens) window.__pararRolagens(); }catch(e){}
    var p=entry.split('|');
    if(p[0]==='mus'){ (window.__amOrig||window.abrirMusica)(p[1], p[2]||'cifra'); }
    else if(p[0]==='cc'){ if(window.cantorAbrir) window.cantorAbrir(+p[1]); }
    else if(p[0]==='ed'){ (window.__edOrig||window.editorCifra)(p[1]); }
    else if(p[0]==='go'){ (window.__goOrig||window.go)(p[1], p[2]===''?undefined:p[2]); }
    window.scrollTo(0,0);
  }
  function _editorComMudancas(){ try{ return !!document.getElementById('edCifra') && typeof _edUndo!=='undefined' && _edUndo.length>0; }catch(e){ return false; } }
  function _arma(){ try{ history.pushState({ibnm:1}, ''); }catch(e){} }
  try{ history.replaceState({ibnm:1,root:1}, ''); }catch(e){}
  _arma();
  window.__voltar=function(){
    /* 1) sobreposições */
    if(_overlayAberto()){ _fecharOverlay(); return true; }
    /* telas de login */
    if(_naAutenticacao()){ if(_telaSecundariaLogin() && typeof telaLogin==='function'){ telaLogin(); return true; } return false; }
    /* editor com alterações não salvas */
    if(_topo() && _topo().indexOf('ed|')===0 && _editorComMudancas() && !confirm('Sair do editor sem salvar as alterações?')) return true;
    /* 2) tela anterior */
    if(navStack.length>1){ navStack.pop(); _irPara(_topo()); return true; }
    /* 3) volta para o Início */
    if(_topo()!==INICIO){ navStack=[INICIO]; _irPara(INICIO); return true; }
    /* 4) já no Início */
    return false;
  };
  window.addEventListener('popstate', function(){
    if(window.__voltar()){ _arma(); return; }
    if(confirm('Deseja sair do aplicativo?')){ history.back(); }
    else { _arma(); }
  });
})();
</script>

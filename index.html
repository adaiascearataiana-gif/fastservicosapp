<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FAST SERVIÇOS — SOLUÇÕES EM LOGÍSTICA</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.box { text-align: center; max-width: 420px; }
.logo {
  font-size: 28px;
  font-weight: 800;
  color: #818cf8;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.logo i { color: #fbbf24; }
.subtitle {
  font-size: 15px;
  color: #94a3b8;
  margin-bottom: 30px;
}
.spinner {
  width: 52px;
  height: 52px;
  border: 4px solid rgba(99,102,241,0.15);
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin: 0 auto 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.info {
  background: rgba(30,41,59,0.6);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 20px 0;
  font-size: 13px;
  color: #94a3b8;
  line-height: 1.6;
}
.btn {
  display: inline-block;
  margin-top: 16px;
  padding: 12px 28px;
  background: #6366f1;
  color: #fff;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 700;
  font-size: 15px;
  transition: background 0.2s;
}
.btn:hover { background: #4f46e5; }
#status {
  margin-top: 16px;
  font-size: 13px;
  color: #94a3b8;
}
.ok { color: #4ade80 !important; }
.err { color: #f87171 !important; }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div class="box">
  <div class="logo"><i>⚡</i> FAST SERVIÇOS</div>
  <div class="subtitle">SOLUÇÕES EM LOGÍSTICA</div>
  <div class="spinner" id="spinner"></div>
  <p id="status">Conectando ao aplicativo…</p>
  <div class="info" id="infoBox" style="display:none;">
    <strong>📍 URL fixa do aplicativo</strong><br>
    Esta página é o endereço permanente do FAST SERVIÇOS. Salve nos favoritos!<br>
    Sempre redireciona para a versão mais recente do app.
  </div>
  <a href="#" class="btn" id="manualLink" style="display:none;">Abrir aplicativo</a>
</div>

<script>
// ============================================================
// URL FIXA — FAST SERVIÇOS
// Esta página SEMPRE redireciona para a versão mais recente do app.
// Mesmo que a URL interna mude (hash de deploy), esta URL fixa
// é atualizada e continua funcionando.
// ============================================================

// URL atual do app (atualizada a cada nova versão)
// Versão: 2026.08.31-r35 — com todas as correções do scanner
var APP_URL = "https://sites.super.myninja.ai/511a31b1-034e-4141-93e9-edaa8ee31638/26ff3fc2/index.html";

var statusEl = document.getElementById('status');
var infoBox = document.getElementById('infoBox');
var manualLink = document.getElementById('manualLink');
var spinner = document.getElementById('spinner');

function tentarRedirecionar() {
  statusEl.textContent = 'Carregando aplicativo…';
  statusEl.className = '';

  // Testar se a URL está acessível antes de redirecionar
  fetch(APP_URL, { method: 'HEAD', mode: 'no-cors' })
    .then(function() {
      statusEl.textContent = 'Redirecionando…';
      statusEl.className = 'ok';
      window.location.href = APP_URL;
    })
    .catch(function() {
      // Falhou — mostrar botão manual e info
      spinner.style.display = 'none';
      statusEl.textContent = 'Toque no botão abaixo para abrir o app';
      statusEl.className = 'err';
      infoBox.style.display = 'block';
      manualLink.style.display = 'inline-block';
      manualLink.href = APP_URL;
    });

  // Failsafe: redirecionar após 3 segundos mesmo assim
  setTimeout(function() {
    window.location.href = APP_URL;
  }, 3000);
}

tentarRedirecionar();
</script>
</body>
</html>

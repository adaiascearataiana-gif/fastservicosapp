<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0891b2">
  <meta name="fast-app-version" content="4.0.15">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>FAST Limpo</title>
  <link rel="manifest" href="manifest.webmanifest?v=r4010">
  <link rel="icon" href="../assets/fast-servicos-icon-192.png?v=r4010">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif}
    body{background:linear-gradient(145deg,#ecfeff,#cffafe);color:#164e63}.app{display:none;width:100%;height:100%;border:0;background:#fff}
    .install-page{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);padding:30px 22px;background:#fff;border:1px solid #a5f3fc;border-radius:26px;text-align:center;box-shadow:0 24px 70px #155e7530}
    .card img{width:120px;height:120px;border-radius:28px}h1{font-size:27px;margin:18px 0 8px}p{color:#475569;line-height:1.55}.safe{padding:12px;border-radius:14px;background:#ecfdf5;color:#166534;font-size:13px;font-weight:700}
    button,.open{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:14px;padding:14px;text-decoration:none;font-size:16px;font-weight:850}button{margin-top:16px;background:linear-gradient(135deg,#0891b2,#2563eb);color:#fff}.open{margin-top:10px;background:#ecfeff;color:#155e75}.status{margin-top:15px;padding:10px;border-radius:12px;background:#f8fafc;color:#475569;font-size:13px}.versao{margin-top:8px;font-size:11px;color:#94a3b8}.standalone .install-page{display:none}.standalone .app{display:block}
  </style>
  <script>window.__installPrompt=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__installPrompt=e});</script>
</head>
<body>
  <iframe class="app" title="FAST Limpo" allow="camera; geolocation; clipboard-read; clipboard-write; publickey-credentials-get *"></iframe>
  <main class="install-page"><section class="card">
    <img src="../assets/fast-servicos-icon-192.png?v=r4010" alt="FAST Limpo">
    <h1>FAST Limpo</h1>
    <p>A plataforma completa, vazia e pronta para começar do zero.</p>
    <div class="safe">Dados separados do aplicativo principal. Esta edição não lê nem altera a base operacional.</div>
    <button id="install" type="button">Instalar FAST Limpo</button>
    <a class="open" href="../?edition=clean">Abrir sem instalar</a>
    <div class="status" id="status">Abra no Google Chrome ou Microsoft Edge para instalar.</div>
    <div class="versao" id="versao">Versão 4.0.15</div>
  </section></main>
  <script>
  (function(){
    var standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
    if(standalone){document.body.classList.add('standalone');document.querySelector('.app').src='../?edition=clean&v=4.0.15'}
    var b=document.getElementById('install'),s=document.getElementById('status');
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=r4010',{scope:'./'}).catch(function(){});
    b.onclick=async function(){if(window.__installPrompt){window.__installPrompt.prompt();var r=await window.__installPrompt.userChoice;window.__installPrompt=null;s.textContent=r.outcome==='accepted'?'Instalação confirmada. Abra o ícone FAST Limpo.':'Instalação cancelada.'}else{s.textContent='No navegador, abra o menu e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.'}};
    addEventListener('appinstalled',function(){s.textContent='FAST Limpo instalado com sucesso!'});
    setInterval(async function(){try{var h=await fetch('../?fast_clean_check='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}),m=h.match(/name=["']fast-app-version["']\s+content=["']([^"']+)/i);if(m&&m[1]!==document.querySelector('meta[name="fast-app-version"]').content)location.reload()}catch(e){}},300000);
  })();
  </script>
</body>
</html>

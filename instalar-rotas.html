<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Instalar Rotas do Dia</title><link rel="manifest" href="manifest-rotas.webmanifest?v=r72"><link rel="icon" href="assets/atalho-rotas-dia-192.png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eef2ff,#c7d2fe);font-family:Arial;color:#1e1b4b}.c{box-sizing:border-box;width:min(88vw,420px);background:#fff;border-radius:26px;padding:30px;text-align:center;box-shadow:0 24px 70px #312e8140}.c img{width:132px;border-radius:30px}.c h1{font-size:25px}.c p{line-height:1.5;color:#475569}.c button{width:100%;border:0;border-radius:14px;padding:15px;background:#4f46e5;color:#fff;font-size:16px;font-weight:800}.hint{font-size:12px;margin-top:14px}</style></head><body><main class="c"><img src="assets/atalho-rotas-dia-192.png" alt="Rotas do Dia"><h1>Rotas do Dia</h1><p>Instale este acesso direto na tela inicial do Android.</p><button id="install">Adicionar à tela inicial</button><div class="hint" id="hint">Ao aparecer a janela do Android, confirme em Instalar.</div></main><script>let pedido=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedido=e});document.getElementById('install').onclick=async()=>{if(pedido){pedido.prompt();await pedido.userChoice;pedido=null}else{document.getElementById('hint').innerHTML='No Chrome, toque em <b>⋮ → Adicionar à tela inicial</b>. O ícone e o nome já estão configurados.'}};</script></body></html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Atualizar FAST</title>
<link rel="icon" href="assets/icone-fast-192.png?v=543">
<style>
:root{--bg:#0f172a;--card:#111c33;--txt:#e5e7eb;--sub:#94a3b8;--ok:#22c55e;--erro:#f87171}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--sub:#475569}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,sans-serif;padding:16px;box-sizing:border-box}
.c{max-width:420px;width:100%;background:var(--card);border-radius:20px;padding:24px;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.25)}
img{width:110px;height:110px;border-radius:22px}
h1{font-size:20px;margin:14px 0 6px}p{margin:6px 0;color:var(--sub)}#st{color:var(--txt);font-weight:700}
</style>
</head>
<body>
<div class="c">
  <img src="assets/icone-fast-192.png?v=543" alt="">
  <h1>Atualizando o FAST…</h1>
  <p id="st">Limpando os arquivos antigos deste aparelho</p>
  <p>Seus dados, fotos e login <b>não</b> são apagados.</p>
</div>
<script>
/* Página de socorro: tira do aparelho QUALQUER cópia velha do app (service workers e
   caches de arquivos) e abre a versão publicada. Não mexe em localStorage nem IndexedDB. */
(async function(){
  var st=document.getElementById('st');
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
      var regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){return r.unregister()}));
    }
  }catch(e){}
  try{
    if(window.caches){var ks=await caches.keys();await Promise.all(ks.filter(function(k){return k.indexOf('fast-fotos-')!==0}).map(function(k){return caches.delete(k)}));}
  }catch(e){}
  var q=new URLSearchParams(location.search), para=q.get('para')||'';
  var destino='./'+(para?para:'')+(para.indexOf('?')>=0?'&':'?')+'fast_fresh='+Date.now();
  st.textContent='Pronto! Abrindo a versão nova…';
  setTimeout(function(){location.replace(destino)},900);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="fast-app-version" content="4.0.33">
<meta name="theme-color" content="#16a34a">
<title>Cliente FAST — Histórico</title>
<style>
:root{--green:#16a34a;--green2:#15803d;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--red:#dc2626;--yellow:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#14532d,#16a34a);color:#fff;padding:18px 16px 22px;position:sticky;top:0;z-index:10;box-shadow:0 4px 18px #0002}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:14px;background:#fff2;display:grid;place-items:center;font-weight:950;font-size:18px;border:1px solid #fff5}.title{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.85;margin-top:2px}
main{max-width:1100px;margin:auto;padding:16px}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:0 15px 40px #0f172a18}.login h1{margin:0 0 6px}.login p{color:var(--muted);font-size:14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #16a34a18}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:850;cursor:pointer}.primary{background:var(--green);color:#fff;width:100%}.secondary{background:#f8fafc;border:1px solid var(--border)}.error{color:var(--red);font-size:13px;margin-top:10px}.hidden{display:none!important}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}.stat small{color:var(--muted);font-weight:750}.stat strong{display:block;font-size:20px;margin-top:5px}.filters{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}.filtergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tablewrap{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:auto}.tabletitle{padding:14px;font-weight:900;border-bottom:1px solid var(--border)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f8fafc}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.paid{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.done{background:#dbeafe;color:#1d4ed8}.route{background:#f1f5f9;color:#334155}.empty{padding:35px;text-align:center;color:var(--muted)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.who{font-weight:850}.logout{padding:8px 11px}.loading{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.filtergrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:10px}.cards{gap:7px}.stat{padding:11px}.stat strong{font-size:16px}.filtergrid{grid-template-columns:1fr}.toprow{align-items:flex-start}.title{font-size:18px}}
</style>
</head>
<body>
<div id="gate" class="gate"><div class="login"><div style="font-size:34px">🟩</div><h1>Cliente FAST</h1><p>Acesse para consultar seu cadastro, histórico de rotas e resumo financeiro.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div><button class="btn primary" id="loginBtn" onclick="login()">Entrar</button><div id="loginErr" class="error"></div></div></div>
<div id="app" class="hidden"><header><div class="head"><div class="logo">FAST</div><div><div class="title">Cliente FAST</div><div class="sub">Histórico, rotas e pagamentos</div></div></div></header><main>
<div class="toprow"><div><div class="who" id="clienteNome">Carregando...</div><div style="font-size:12px;color:var(--muted)" id="clienteContato"></div></div><button class="btn secondary logout" onclick="logout()">Sair</button></div>
<div id="loading" class="loading">Carregando histórico...</div>
<div id="content" class="hidden">
<div class="cards"><div class="stat"><small>Rotas</small><strong id="sRotas">0</strong></div><div class="stat"><small>Total faturado</small><strong id="sTotal">R$ 0,00</strong></div><div class="stat"><small>Já pago</small><strong id="sPago">R$ 0,00</strong></div><div class="stat"><small>Pendente</small><strong id="sPendente">R$ 0,00</strong></div></div>
<div class="filters"><div style="font-weight:900;margin-bottom:10px">Filtros do histórico</div><div class="filtergrid"><div class="field" style="margin:0"><label>Período inicial</label><input id="de" type="date" onchange="render()"></div><div class="field" style="margin:0"><label>Período final</label><input id="ate" type="date" onchange="render()"></div><div class="field" style="margin:0"><label>Pagamento</label><select id="pag" onchange="render()"><option value="">Todos</option><option value="Recebido">Recebido</option><option value="Pendente">Pendente</option></select></div><div class="field" style="margin:0"><label>Execução</label><select id="exec" onchange="render()"><option value="">Todas</option><option value="CONCLUÍDA">Concluída</option><option value="EM ROTA">Em rota</option></select></div></div></div>
<div class="tablewrap"><div class="tabletitle">Histórico de rotas</div><div id="table"></div></div>
</div></main></div>
<script>
const PROJECT='https://yhxuplhohhetzloxvgku.supabase.co';
const KEY='sb_publishable_jlsorkXci3_0Hla7gt8z1g_pe6zOT19';
let session=null,cliente=null,rotas=[];
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const dateBR=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?p.reverse().join('/'):s};
async function rest(table,query=''){const r=await fetch(PROJECT+'/rest/v1/'+table+'?'+query,{headers:{apikey:KEY,Authorization:'Bearer '+(session?.access_token||KEY)}});if(!r.ok)throw new Error('Não foi possível consultar os dados.');return r.json()}
async function auth(path,body){const r=await fetch(PROJECT+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||'Usuário ou senha incorretos.');return d}
async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;$('loginErr').textContent='';if(!email||!password){$('loginErr').textContent='Informe e-mail e senha.';return}$('loginBtn').disabled=true;try{session=await auth('token?grant_type=password',{email,password});localStorage.setItem('fast_cliente_session',JSON.stringify(session));await iniciar()}catch(e){$('loginErr').textContent=e.message||'Não foi possível entrar.'}finally{$('loginBtn').disabled=false}}
function logout(){session=null;localStorage.removeItem('fast_cliente_session');location.reload()}
async function iniciar(){ $('gate').classList.add('hidden');$('app').classList.remove('hidden');try{const user=session.user||{};const email=norm(user.email||'');const meta=user.user_metadata||{};const nomeMeta=norm(meta.fast_user||meta.nome||'');const clientes=await rest('clientes','select=id,dados&limit=1000');cliente=clientes.map(x=>({...x,...(x.dados||{})})).find(c=>norm(c.email)===email || (nomeMeta&&norm(c.nome)===nomeMeta));if(!cliente)throw new Error('Seu acesso foi autenticado, mas o cadastro de Cliente FAST correspondente não foi encontrado.');$('clienteNome').textContent=cliente.nome||cliente.razaoSocial||user.email;$('clienteContato').textContent=[cliente.email,cliente.telefone||cliente.whatsapp].filter(Boolean).join(' • ');const rs=await rest('rotas','select=id,cliente,origem,destino,data,pagamento,status,statusexecucao,valor,tipovolume,qtdmercadorias,descricao&order=data.desc&limit=5000');rotas=rs.filter(r=>norm(r.cliente)===norm(cliente.nome));$('loading').classList.add('hidden');$('content').classList.remove('hidden');render()}catch(e){$('loading').textContent=e.message||'Não foi possível carregar o histórico.'}}
function render(){let a=rotas.slice();const de=$('de').value,ate=$('ate').value,pag=$('pag').value,exec=$('exec').value;if(de)a=a.filter(r=>String(r.data||'').slice(0,10)>=de);if(ate)a=a.filter(r=>String(r.data||'').slice(0,10)<=ate);if(pag)a=a.filter(r=>String(r.status||'')===pag);if(exec)a=a.filter(r=>String(r.statusexecucao||'')===exec);const total=a.reduce((s,r)=>s+(Number(r.valor)||0),0),pago=a.filter(r=>norm(r.status)==='recebido').reduce((s,r)=>s+(Number(r.valor)||0),0),pend= a.filter(r=>norm(r.status)==='pendente').reduce((s,r)=>s+(Number(r.valor)||0),0);$('sRotas').textContent=a.length;$('sTotal').textContent=money(total);$('sPago').textContent=money(pago);$('sPendente').textContent=money(pend);if(!a.length){$('table').innerHTML='<div class="empty">Nenhuma rota encontrada para os filtros selecionados.</div>';return}let html='<table><thead><tr><th>Data</th><th>Origem</th><th>Destino</th><th>Volumes</th><th>Pagamento</th><th>Execução</th><th>Valor</th></tr></thead><tbody>';a.forEach(r=>{const p=norm(r.status)==='recebido'?'paid':'pending';const e=norm(r.statusexecucao)==='concluida'?'done':'route';html+=`<tr><td>${dateBR(r.data)}</td><td>${esc(r.origem)}</td><td>${esc(r.destino)}</td><td>${esc(r.qtdmercadorias||0)} ${esc(r.tipovolume||'')}</td><td><span class="badge ${p}">${esc(r.status||'—')}</span></td><td><span class="badge ${e}">${esc(r.statusexecucao||'—')}</span></td><td><strong>${money(r.valor)}</strong></td></tr>`});html+='</tbody></table>';$('table').innerHTML=html}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{try{const s=JSON.parse(localStorage.getItem('fast_cliente_session')||'null');if(s&&s.access_token){session=s;await iniciar()}}catch(e){localStorage.removeItem('fast_cliente_session')}})();
</script>
</body></html>

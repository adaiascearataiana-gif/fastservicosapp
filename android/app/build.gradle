plugins { id 'com.android.application' }

android {
    namespace 'br.com.fastservicos.app'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 30103
        versionName '3.1.3'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('HOME') + '/.android/fast-release.jks')
            storePassword System.getenv('FAST_ANDROID_STORE_PASSWORD')
            keyAlias 'fast-apps'
            keyPassword System.getenv('FAST_ANDROID_KEY_PASSWORD')
        }
    }

    flavorDimensions += 'aplicativo'
    productFlavors {
        cliente {
            dimension 'aplicativo'
            applicationId 'br.com.fastservicos.cliente'
            resValue 'string', 'app_name', 'Cliente FAST'
            buildConfigField 'String', 'APP_URL', '"https://adaiascearataiana-gif.github.io/fastservicosapp/app-cliente/?source=android"'
        }
        motorista {
            dimension 'aplicativo'
            applicationId 'br.com.fastservicos.motorista'
            resValue 'string', 'app_name', 'FAST Motorista'
            buildConfigField 'String', 'APP_URL', '"https://adaiascearataiana-gif.github.io/fastservicosapp/app-motorista/?source=android"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

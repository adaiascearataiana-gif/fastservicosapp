<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FAST Motorista</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf7f5;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#134e4a 0,transparent 35%),#07111f}.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:rgba(7,17,31,.88);backdrop-filter:blur(18px);border-bottom:1px solid #1f3b4d}.brand{font-weight:900}.brand b{color:#facc15}.pill{padding:6px 10px;border-radius:999px;background:#0f766e;font-size:11px;font-weight:800}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:rgba(15,35,51,.92);border:1px solid #25495c;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 18px 40px #0004}h1{font-size:24px;margin:0 0 5px}h2{font-size:18px}.muted{color:#9bb3c2;font-size:13px}.route .client{font-size:20px;font-weight:900}.route .dest{margin:10px 0;color:#d7e5eb;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}button,input{border:0;border-radius:12px;padding:13px 14px;font:700 14px inherit}input{width:100%;margin:6px 0;background:#fff;color:#10202b}button{cursor:pointer;color:#fff;background:#0f766e}button.arrive{background:#d97706}button.done{background:#15803d}button.nav{background:#2563eb}button.photo{background:#7c3aed}.full{grid-column:1/-1}.hidden{display:none!important}.status{padding:10px;border-radius:10px;background:#092f2b;color:#7ef0d6;margin:12px 0}.error{background:#441b24;color:#fecdd3}.empty{text-align:center;padding:42px 16px}.login{max-width:430px;margin:8vh auto}.login .logo{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;background:#facc15;color:#082f49;font-size:32px;font-weight:950}.progress{height:7px;border-radius:9px;background:#233c4c;overflow:hidden}.progress i{display:block;height:100%;width:35%;background:#2dd4bf;animation:move 1s infinite alternate}@keyframes move{to{transform:translateX(180%)}}@media(max-width:520px){.actions{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:13px}}
</style></head><body>
<header class="top"><div class="brand"><b>FAST</b> MOTORISTA</div><div id="online" class="pill">ONLINE</div></header>
<main class="wrap"><section id="login" class="card login"><div class="logo">F</div><h1>Acesso do motorista</h1><p class="muted">Entre com o usuário criado pela administração.</p><input id="user" autocomplete="username" placeholder="Usuário"><input id="pwd" type="password" autocomplete="current-password" placeholder="Senha"><button class="full" onclick="login()">Entrar com segurança</button><div id="msg"></div><details><summary class="muted">Configurar conexão</summary><input id="url" placeholder="URL REST do Supabase"><input id="key" type="password" placeholder="Chave anon pública"><button onclick="saveConfig()">Salvar conexão</button></details></section><section id="app" class="hidden"><div class="card"><h1 id="hello">Minhas rotas</h1><p class="muted" id="today"></p><div id="sync"></div></div><div id="routes"></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), state={access:null,routes:[],watch:null};
const cfg=()=>({url:localStorage.getItem('fast_motorista_sb_url')||'',key:localStorage.getItem('fast_motorista_sb_key')||''});
const hdr=extra=>Object.assign({apikey:cfg().key,Authorization:'Bearer '+cfg().key,'Content-Type':'application/json'},extra||{});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveConfig(){localStorage.setItem('fast_motorista_sb_url',$('url').value.trim().replace(/\/$/,''));localStorage.setItem('fast_motorista_sb_key',$('key').value.trim());note('Conexão salva.','ok')}
function note(text,type){$('msg').className='status '+(type==='error'?'error':'');$('msg').textContent=text}
async function digest(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){try{const c=cfg();if(!c.url||!c.key)throw Error('Configure o Supabase primeiro.');const u=$('user').value.trim().toLowerCase(),p=$('pwd').value;if(!u||!p)throw Error('Informe usuário e senha.');note('Validando acesso...');const r=await fetch(c.url+'/motorista_acessos?usuario=eq.'+encodeURIComponent(u)+'&ativo=eq.true&select=*',{headers:hdr()});if(!r.ok)throw Error('Falha de conexão ('+r.status+').');const rows=await r.json(),a=rows[0];if(!a)throw Error('Usuário não encontrado ou bloqueado.');const candidates=[await digest(p+(a.salt||'')),await digest((a.salt||'')+p),await digest(p)];if(a.senha_hash&&!candidates.includes(String(a.senha_hash).toLowerCase()))throw Error('Senha inválida.');state.access=a;sessionStorage.setItem('fast_motorista_session',JSON.stringify({id:a.id,motorista_id:a.motorista_id,nome:a.nome||u}));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='Olá, '+(a.nome||u);startGps();await loadRoutes()}catch(e){note(e.message,'error')}}
async function loadRoutes(){const c=cfg(),id=state.access.motorista_id,today=new Date().toISOString().slice(0,10);$('today').textContent=new Date().toLocaleDateString('pt-BR',{dateStyle:'full'});$('sync').innerHTML='<div class="progress"><i></i></div>';try{const q='/sequencias_itens?motorista_id=eq.'+encodeURIComponent(id)+'&data=eq.'+today+'&select=*&order=id.asc';const r=await fetch(c.url+q,{headers:hdr()});if(!r.ok)throw Error('Não foi possível carregar as rotas.');state.routes=await r.json();render()}catch(e){$('routes').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}finally{$('sync').innerHTML=''}}
function render(){const host=$('routes');if(!state.routes.length){host.innerHTML='<div class="card empty"><h2>✅ Nenhuma rota atribuída hoje</h2><p class="muted">Novas rotas aparecerão após sincronizar.</p><button onclick="loadRoutes()">Sincronizar</button></div>';return}host.innerHTML=state.routes.map((r,i)=>`<article class="card route"><span class="pill">ROTA ${i+1}</span><div class="client">${esc(r.cliente||'Cliente')}</div><div class="dest"><b>Destino</b><br>${esc(r.destino||'-')}</div><div class="muted">${r.chegou_em?'🟠 Cheguei: '+new Date(r.chegou_em).toLocaleTimeString('pt-BR'):''} ${r.concluida_em?' · ✅ Concluída':''}</div><div class="actions"><button class="nav" onclick="navigate('${encodeURIComponent(r.destino||'')}')">Navegar</button><button class="arrive" onclick="mark('${esc(r.id)}','chegou_em')">Cheguei</button><label><input class="hidden" type="file" accept="image/*" capture="environment" onchange="photo('${esc(r.id)}',this)"><span style="display:block;text-align:center" class="photo">📷 Tirar foto</span></label><button class="done" onclick="mark('${esc(r.id)}','concluida_em')">Concluir rota</button></div></article>`).join('')}
function navigate(d){open('https://www.google.com/maps/search/?api=1&query='+d,'_blank')}
async function mark(id,field){const now=new Date().toISOString();const r=await fetch(cfg().url+'/sequencias_itens?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:hdr({Prefer:'return=minimal'}),body:JSON.stringify({[field]:now})});if(!r.ok)return alert('Não foi possível atualizar.');const item=state.routes.find(x=>String(x.id)===String(id));if(item)item[field]=now;render()}
async function photo(routeId,input){const file=input.files[0];if(!file)return;const data=await new Promise((ok,no)=>{const x=new FileReader;x.onload=()=>ok(x.result);x.onerror=no;x.readAsDataURL(file)});const body={motorista_id:state.access.motorista_id,rota_id:routeId,nome_arquivo:file.name||('foto-'+Date.now()+'.jpg'),mime_type:file.type||'image/jpeg',dados_base64:data,processado:false,created_at:new Date().toISOString()};const r=await fetch(cfg().url+'/motorista_fotos',{method:'POST',headers:hdr({Prefer:'return=minimal'}),body:JSON.stringify(body)});alert(r.ok?'Foto enviada para a fila do Google Drive.':'A foto não foi enviada. Tente novamente.')}
function startGps(){if(!navigator.geolocation)return;state.watch=navigator.geolocation.watchPosition(async p=>{const body={motorista_id:state.access.motorista_id,latitude:p.coords.latitude,longitude:p.coords.longitude,precisao:p.coords.accuracy,atualizado_em:new Date().toISOString()};await fetch(cfg().url+'/rastreamento?motorista_id=eq.'+encodeURIComponent(state.access.motorista_id),{method:'POST',headers:hdr({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)}).catch(()=>{})},()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:12000})}
addEventListener('online',()=>{$('online').textContent='ONLINE';loadRoutes()});addEventListener('offline',()=>{$('online').textContent='OFFLINE'});$('url').value=cfg().url;$('key').value=cfg().key;
</script><script src="desktop-bridge.js"></script></body></html>

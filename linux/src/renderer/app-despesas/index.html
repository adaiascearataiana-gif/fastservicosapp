// (r145/r243 / 2.3.32) SHARE TARGET: quando o Android compartilha um ou
// varios comprovantes (PDF de boleto/recibo ou imagem JPG/PNG) com o app
// Despesas, o Service Worker guarda os arquivos e abre "./?share=1". Aqui
// recuperamos a LISTA (r243) e repassamos ao app principal (iframe) via
// postMessage assim que ele estiver pronto ("fast-share-ready"). O app
// anexa TODOS os comprovantes, entra automaticamente no campo da leitura
// OCR/IA e preenche os campos sozinho: RECEBEDOR -> LOCAL, VALOR -> valor,
// DATA -> data (+ descricao/categoria) - so conferir e salvar.
(function(){
  var KEY_TS='fastShareTsDespesas';
  function encerrar(msg){
    try{var s=document.getElementById('status');if(s&&msg)s.textContent=msg}catch(e){}
  }
  function buscar(){
    if(!('serviceWorker' in navigator)){return}
    var ts='';
    try{ts=sessionStorage.getItem(KEY_TS)||''}catch(e){}
    fetch('./__fast-share-get__?t='+Date.now(),{cache:'no-store'}).then(function(r){
      return r&&r.ok?r.json():{ok:false,item:null,files:[]};
    }).then(function(j){
      var lista=(j&&j.files&&j.files.length)?j.files:(j&&j.ok&&j.item&&j.item.b64?[j.item]:[]);
      if(!lista.length){encerrar('');return}
      if(ts&&String(j.ts||lista[0].ts||'')===String(ts)){encerrar('');return}
      try{sessionStorage.setItem(KEY_TS,String(j.ts||lista[0].ts||''))}catch(e){}
      // converte todos os base64 recebidos em Blobs reais
      var arquivos=[];
      for(var i=0;i<lista.length;i++){
        try{
          var it=lista[i];
          var mime=(it.mime||'application/octet-stream').toLowerCase();
          var bin=atob(it.b64||'');
          var n=bin.length,bytes=new Uint8Array(n);
          while(n--){bytes[n]=bin.charCodeAt(n)}
          var blob=new Blob([bytes],{type:it.mime||'application/octet-stream'});
          if(blob.size<1)continue;
          arquivos.push({nome:it.nome,mime:it.mime,tamanho:it.tamanho||blob.size,file:blob});
        }catch(e){}
      }
      if(!arquivos.length){encerrar('');return}
      var entregue=false;
      function encaminhar(tent){
        if(entregue)return;
        var f=document.querySelector('.app');
        if(!f){if(tent<60){setTimeout(function(){encaminhar(tent+1)},300)}return}
        try{
          // r243: envia a LISTA completa (fallback para arquivo unico se o
          // app principal ainda estiver na versao antiga r145)
          f.contentWindow.postMessage({type:'fast-share-comprovantes',files:arquivos},'*');
          f.contentWindow.postMessage({type:'fast-share-comprovante',nome:arquivos[0].nome,mime:arquivos[0].mime,tamanho:arquivos[0].tamanho,file:arquivos[0].file},'*');
          entregue=true;
        }catch(e){if(tent<60){setTimeout(function(){encaminhar(tent+1)},300)}}
      }
      // Encaminha quando o app principal (iframe) anuncia que esta pronto
      // (script r145/r243 envia 'fast-share-ready' ao carregar) e, como
      // garantia, tenta tambem 3s depois caso o aviso nao chegue.
      addEventListener('message',function(ev){
        if(ev&&ev.data&&ev.data.type==='fast-share-ready'){encaminhar(0)}
      });
      setTimeout(function(){encaminhar(0)},3000);
    }).catch(function(){encerrar('')});
  }
  var q='';
  try{q=location.search||''}catch(e){}
  if(/[?&]share=1/.test(q)||/[?&]share=post/.test(q)){buscar()}
})();
// (r119) Auto-atualizacao SEM interacao: consulta a versao real do app principal
// (meta fast-app-version, com cache-busting) e recarrega sozinho quando uma nova
// versao e publicada. A versao nao fica mais fixa no HTML (era v=2.3.4 desatualizado).
var VER_KEY='fastWrapVerDespesas',frame=document.querySelector('.app'),link=document.querySelector('.open');
var verAtual='';try{verAtual=localStorage.getItem(VER_KEY)||''}catch(e){}
function montarSrc(v){return '../?exclusive=despesas&atalho=despesas'+(v?'&v='+encodeURIComponent(v):'')}
function aplicarVer(nova){if(standalone&&frame)frame.src=montarSrc(nova);if(link)link.href=montarSrc(nova);if(v)v.textContent=nova?'Vers\u00e3o '+nova:''}
aplicarVer(verAtual);
var recarregando=false;
function checarAtualizacao(){
  if(recarregando)return;
  if('serviceWorker'in navigator&&navigator.serviceWorker.getRegistration){try{navigator.serviceWorker.getRegistration('./').then(function(reg){if(reg&&reg.update)reg.update().catch(function(){})}).catch(function(){})}catch(e){}}
  fetch('../?fast_check='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    if(!t)return;
    var m=/name="fast-app-version"\s+content="([^"]+)"/.exec(t);
    if(!m)return;
    var nova=m[1];
    if(!verAtual){verAtual=nova;try{localStorage.setItem(VER_KEY,nova)}catch(e){}aplicarVer(nova);return}
    if(nova!==verAtual){
      try{localStorage.setItem(VER_KEY,nova)}catch(e){}
      if(standalone){recarregando=true;location.reload()}else{verAtual=nova;aplicarVer(nova)}

  }).catch(function(){});
}

setInterval(checarAtualizacao,300000);})();</script></body></html>

name: Gerar Cliente e Motorista para Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release existente para atualizar os instaladores'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        shell: bash
        run: |
          # Usa o SDK pre-instalado do runner para evitar conflito de caminhos
          # (ANDROID_HOME x ANDROID_SDK_ROOT) que quebra o Gradle.
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restaurar assinatura protegida
        shell: bash
        env:
          FAST_ANDROID_KEYSTORE_BASE64: ${{ secrets.FAST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$FAST_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/fast-release.jks"
          test -s "$HOME/.android/fast-release.jks"
      - name: Gerar APKs independentes
        working-directory: android
        env:
          FAST_ANDROID_STORE_PASSWORD: ${{ secrets.FAST_ANDROID_STORE_PASSWORD }}
          FAST_ANDROID_KEY_PASSWORD: ${{ secrets.FAST_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleClienteRelease :app:assembleMotoristaRelease :app:assembleRotasRelease :app:assembleDespesasRelease :app:assembleFastRelease :app:assembleLimpoRelease --no-daemon
      - name: Preparar downloads
        shell: bash
        run: |
          cp android/app/build/outputs/apk/cliente/release/app-cliente-release.apk Cliente-FAST-Android.apk
          cp android/app/build/outputs/apk/motorista/release/app-motorista-release.apk Motorista-FAST-Android.apk
          cp android/app/build/outputs/apk/rotas/release/app-rotas-release.apk Rotas-do-Dia-FAST-Android.apk
          cp android/app/build/outputs/apk/despesas/release/app-despesas-release.apk Despesas-FAST-Android.apk
          cp android/app/build/outputs/apk/fast/release/app-fast-release.apk FAST-Servicos-Android.apk
          cp android/app/build/outputs/apk/limpo/release/app-limpo-release.apk FAST-Limpo-Android.apk
      - name: Publicar APKs na pasta downloads do site
        # O site baixa os apps de /downloads/. Sem este passo os APKs novos iam só
        # para o Release e o site continuava entregando o APK antigo (4.0.8).
        shell: bash
        run: |
          git config user.name "FAST-bot"
          git config user.email "fast-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B publicar-apks origin/main
          mkdir -p downloads
          cp Cliente-FAST-Android.apk Motorista-FAST-Android.apk Rotas-do-Dia-FAST-Android.apk \
             Despesas-FAST-Android.apk FAST-Servicos-Android.apk FAST-Limpo-Android.apk downloads/
          git add downloads/*.apk
          if git diff --cached --quiet; then echo "APKs iguais, nada a publicar"; exit 0; fi
          git commit -m "APKs Android atualizados ($(date +%Y-%m-%d)) - biometria e camera"
          git push origin publicar-apks:main
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            Cliente-FAST-Android.apk
            Motorista-FAST-Android.apk
            Rotas-do-Dia-FAST-Android.apk
            Despesas-FAST-Android.apk
            FAST-Servicos-Android.apk
            FAST-Limpo-Android.apk

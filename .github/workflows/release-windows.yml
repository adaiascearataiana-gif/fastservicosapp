name: Gerar FAST Serviços para Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release existente para atualizar os instaladores'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - run: npm ci
      - run: npm run dist:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            linux/dist/*.exe
            linux/dist/latest.yml
